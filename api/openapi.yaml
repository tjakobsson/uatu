        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/live:
    get:
      operationId: hubStreamLive
      tags: [Live stream]
      summary: Open the live stream for a workspace
      description: |
        One long-lived Server-Sent Events connection per client. It carries
        every pushed update for one workspace, meaning document state, the
        conversation inventory, conversation events, and worktree inventory
        invalidations. On request it also
        carries an activity summary of every workspace the caller may access.
        streaming.yaml#channels.live defines the frames, envelopes, topics,
        cursors, and signals.

        The response writes an `: open` comment frame at once, then one
        `hello` event. Its stream id addresses `hubUpdateLiveSubscriptions`,
        and only the Hub session that opened the stream may use it. Upstream
        failures arrive as signals for the affected subscription and never
        end the stream. To reconnect, open a new stream and present every
        retained cursor in `subs`. The stream does not use the SSE `id` field
        or `Last-Event-ID`.
      parameters:
        - name: ws
          in: query
          required: true
          schema: { $ref: '#/components/schemas/WorkspaceId' }
          description: "Workspace whose document, inventory, conversation, and worktrees topics the stream carries. Required. An absent or empty id, or one longer than 256 UTF-8 bytes, answers 400 (absent: `workspace id required`). An id that is unknown, or that the caller may not access, answers 404."
        - name: activity
          in: query
          schema: { type: string, enum: ['0', '1'], default: '0' }
          description: "`1` adds the activity topic. The Hub sends one summary per workspace the caller may access when the stream opens, then one whenever a workspace's facts change."
        - name: subs
          in: query
          schema: { type: string, contentMediaType: application/json, contentSchema: { $ref: '#/components/schemas/LiveSubscriptionList' } }
          description: "Initial subscriptions as a JSON array of LiveSubscription, each with the cursor to resume from. A reconnect presents every retained cursor here. Malformed JSON or an invalid entry answers 400. The set rides the query string, and proxies commonly refuse a request line past about 8 KB. A client whose set would exceed that presents part of it here and adds the rest with hubUpdateLiveSubscriptions after `hello`, from the same cursors."
        - name: reconnect
          in: query
          schema: { type: string, enum: ['0', '1'], default: '0' }
          description: "`1` when this stream replaces one the client lost. The Hub records it in diagnostics and behaves the same either way."
      responses:
        '200':
          description: SSE stream described by streaming.yaml#channels.live
          content:
            text/event-stream: { schema: { type: string } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: "A cookie-authenticated request failed the same-origin check, and nothing was subscribed. Its `Origin` names another origin, or its `Sec-Fetch-Site` is present and neither `same-origin` nor `none`, as on a link followed from another site or from another port on the same host. A bearer-authenticated request is not checked."
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404': { $ref: '#/components/responses/Error' }
  /api/hub/live/{streamId}/subscriptions:
    parameters: [{ $ref: '#/components/parameters/LiveStreamId' }]
    post:
      operationId: hubUpdateLiveSubscriptions
      tags: [Live stream]
      summary: Change an open live stream's subscriptions
      description: |
        Adds and removes subscriptions on an open stream without reconnecting.
        Removals apply before additions. Adding a topic and key that is
        already subscribed replaces the subscription and re-attaches it from
        the new cursor. A client answers a `resync` signal this way. It takes
        a fresh snapshot, then adds the subscription again with the
        snapshot's cursor. Once this operation answers, the stream carries no
        further envelope for a removed subscription.

        A 400, 403, or 404 answer means this stream cannot take the change,
        and repeating the request fails the same way. Reconnect and present
        the whole subscription set in `subs`. Retry a 5xx, or a request that
        got no answer, with backoff a bounded number of times, then
        reconnect. Validate subscriptions against the byte and count bounds
        before sending: one the Hub refuses here is refused in `subs` too, on
        every reconnect.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/LiveSubscriptionChange' } }
      responses:
        '200':
          description: Subscriptions changed
          content:
            application/json: { schema: { $ref: '#/components/schemas/LiveSubscriptionsUpdated' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403':
          description: The stream belongs to another Hub session, or a cookie-authenticated request failed the same-origin check.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
        '404':
          description: The stream is unknown or has ended. Reconnect and present the whole subscription set in `subs`.
          content:
            application/json: { schema: { $ref: '#/components/schemas/Error' } }
  /s/{workspaceId}/api/personal-state:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      operationId: workspaceGetPersonalState
      tags: [Hub]
      summary: Read per-user workspace state
      description: The Hub stores personal state per Hub user and workspace and answers this request itself, without proxying it to the workspace child, so it answers whether or not the workspace is running. The operation ID predates the move to the Hub domain and is kept for generated clients.
      responses:
        '200':
          description: Personal state
          content:
            application/json: { schema: { $ref: '#/components/schemas/PersonalState' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      operationId: workspacePatchPersonalState
      tags: [Hub]
      summary: Patch per-user workspace state
      description: The Hub applies and stores the patch itself, without proxying it to the workspace child. The operation ID predates the move to the Hub domain and is kept for generated clients.
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/PersonalStatePatch' } }
      responses:
        '200':
          description: Updated personal state
          content:
            application/json: { schema: { $ref: '#/components/schemas/PersonalState' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/worktrees:
    get:
      operationId: hubListWorktrees
      tags: [Worktrees]
      summary: List a repository's checkouts
      description: |
        The authoritative Git worktree inventory of one workspace's
        repository family, reconciled from Git at the time of the request. A
        workspace that is a linked worktree resolves to its main workspace,
        which owns the family and its credential policy.
      security:
        - hubBearer: []
        - hubCookie: []
        - worktreeCapability: []
      parameters:
        - name: source
          in: query
          required: false
          schema: { $ref: '#/components/schemas/WorkspaceId' }
          description: "The workspace whose repository family to list. Optional for a worktree capability, which names one family already; required for a Hub session."
      responses:
        '200': { $ref: '#/components/responses/WorktreeInventory' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '405': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/worktrees/create:
    post:
      operationId: hubCreateWorktree
      tags: [Worktrees]
      summary: Create a linked worktree
      description: |
        Adds an ordinary linked worktree and registers it as its own
        workspace, through the same service and the same safety rules the
        Hub's own interface uses. The destination is predetermined
        (`<main-folder>.worktrees/<safe-branch-folder>`) and is never an
        input. Nothing is ever forced: a branch checked out elsewhere, an
        occupied destination or a ref that is not available is a refusal
        carrying the existing checkout to open instead.

        A refusal is a completed request: it answers 200 with
        `ok: false` and a sanitized error, because the Hub processed the
        request and decided against it. HTTP statuses report transport-level
        problems only.
      security:
        - hubBearer: []
        - hubCookie: []
        - worktreeCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorktreeRequest' }
            examples:
              newBranch:
                summary: A new branch from an unqualified ref the Hub resolves
                value: { sourceWorkspaceId: atlas, mode: new-branch, branch: feature/login, baseRef: main, start: false }
              remoteTracking:
                summary: A tracking branch from a remote-qualified ref
                value: { sourceWorkspaceId: atlas, mode: remote-tracking, base: { kind: remote, ref: origin/release } }
      responses:
        '200': { $ref: '#/components/responses/WorktreeOperation' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '405': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/worktrees/open:
    post:
      operationId: hubOpenWorktree
      tags: [Worktrees]
      summary: Report, and optionally start, an existing checkout
      description: |
        Reports where a registered checkout of this repository family is and
        whether it runs. With `start: true` it also starts that workspace,
        through the Hub's ordinary start with all its recovery fences. A
        failed explicit start does not fail the operation: the workspace
        stays configured and stopped, and `startError` reports why. This
        operation never registers an unregistered checkout and never
        migrates a conversation.
      security:
        - hubBearer: []
        - hubCookie: []
        - worktreeCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenWorktreeRequest' }
            example: { sourceWorkspaceId: atlas, reference: feature/login, start: true }
      responses:
        '200': { $ref: '#/components/responses/WorktreeOperation' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '405': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/worktrees/delete:
    post:
      operationId: hubDeleteWorktree
      tags: [Worktrees]
      summary: Delete a worktree Uatu created
      description: |
        Removes a verified Uatu-created linked checkout after every safety
        check — ownership, identity, tracked, untracked and ignored data,
        Git locks, nested worktrees and known activity — and always keeps the
        branch. `confirm: true` is required and is itself the authorization;
        there is no force, no override of any blocker, and no branch
        deletion. `stop: true` additionally authorizes stopping this
        worktree's own Uatu sessions; activity Uatu does not own remains a
        blocker. A blocked or failed deletion retains both the checkout and
        its registration.
      security:
        - hubBearer: []
        - hubCookie: []
        - worktreeCapability: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeleteWorktreeRequest' }
            example: { sourceWorkspaceId: atlas, reference: feature/login, confirm: true, stop: true }
      responses:
        '200': { $ref: '#/components/responses/WorktreeOperation' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '405': { $ref: '#/components/responses/NoStoreError' }
components:
  securitySchemes:
    hubBearer: { type: http, scheme: bearer, description: Session ID returned by native JSON login. }
    worktreeCapability:
      type: http
      scheme: bearer
      description: |
        A least-privilege worktree capability, not a Hub session. The Hub
        issues one per running workspace, writes it into that workspace's
        private session runtime directory as an owner-only file, and puts
        only that file's path in the workspace child's environment — so a
        process inside the workspace, including an agent the user runs in its
        terminal, can present it without it ever appearing in an argument
        vector or an environment value.

        It carries the `uatu-wt-` prefix, which is how the Hub tells it from
        a session id. It authorizes ONLY this operation family, and only for
        the one repository family of the workspace it was issued to: the Hub
        answers 403 for a capability presented on any other route or aimed at
        any other workspace. It is revoked when that workspace's session
        stops and when the workspace, or the main workspace of its family, is
        forgotten or removed, and it expires independently of that. A
        capability the Hub does not accept answers 401; the remedy is to
        restart the workspace, never to present another credential.
    hubCookie:
      type: apiKey
      in: cookie
      name: uatu_hub
      description: |
        The browser session cookie. `uatu_hub` is its name when the Hub is reached at the scheme's default port. At any other port the name carries that port as `uatu_hub_<port>`, so `uatu_hub_4701` for a Hub reached at `127.0.0.1:4701`. Browsers scope cookies by host, not port, and Hubs on different ports of one host would otherwise overwrite each other's session. Login sets, every request reads, and sign-out clears the cookie under that name. A bare `uatu_hub` presented at a non-default port is ignored.
  parameters:
    WorkspaceId: { name: workspaceId, in: path, required: true, schema: { $ref: '#/components/schemas/WorkspaceId' } }
    CredentialId: { name: credentialId, in: path, required: true, schema: { $ref: '#/components/schemas/CredentialId' } }
    CredentialTool: { name: tool, in: path, required: true, schema: { $ref: '#/components/schemas/CredentialToolName' } }
    JobId: { name: jobId, in: path, required: true, schema: { type: string, minLength: 1 } }
    LiveStreamId: { name: streamId, in: path, required: true, schema: { type: string, minLength: 1 }, description: "Opaque id from the stream's hello event." }
  responses:
    Error:
      description: JSON error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: request rejected }
    FolderMutationError:
      description: Folder mutation rejected
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FolderMutationError' }
          example: { error: folder operation failed }
    Accepted:
      description: Request accepted
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Accepted' }
    NoStoreAccepted:
      description: Secret input accepted
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } }
    NoStoreError:
      description: Request failed; the response must not be stored because the request may contain secret input.
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Revoked:
      description: Session revoked
      content:
        application/json:
          schema: { $ref: '#/components/schemas/RevocationResult' }
    WorkspaceAction:
      description: Workspace lifecycle result
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorkspaceAction' }
    CredentialList:
      description: Public credential inventory. Stored private keys, passphrases, and token values are never returned.
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialList' } } }
    CredentialToolList:
      description: Credential-tool inventory
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialToolList' } } }
    CredentialPublicKey:
      description: Public key material. No private key material is returned.
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialPublicKey' } } }
    Credential:
      description: Public credential metadata. Submitted and stored secrets are never returned.
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialResponse' } } }
    CredentialTool:
      description: Credential-tool readiness
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialToolResponse' } } }
    CredentialAssignment:
      description: Persisted advisory workspace assignment
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssignmentResponse' } } }
    CredentialAssignments:
      description: Atomically persisted advisory workspace assignments
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialAssignmentsResponse' } } }
    CredentialUnassigned:
      description: Assignment removal result
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialUnassignedResponse' } } }
    CredentialTest:
      description: Bounded, sanitized readiness results
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialTestResponse' } } }
    CredentialDeleted:
      description: Credential deletion result
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content: { application/json: { schema: { $ref: '#/components/schemas/CredentialDeletedResponse' } } }
    WorktreeInventory:
      description: Authoritative Git worktree inventory for one repository family
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorktreeInventoryResponse' }
          example:
            inventory:
              repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e
              sourceWorkspaceId: atlas
              status: ready
              checkouts:
                - { checkoutId: 9a1b, repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e, workspaceId: atlas, path: /src/atlas, branch: main, detached: false, main: true, ownership: main, availability: present, registered: true, running: true, locked: false }
                - { checkoutId: 7c2d, repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e, workspaceId: feature-login, parentWorkspaceId: atlas, path: /src/atlas.worktrees/feature-login, branch: feature/login, detached: false, main: false, ownership: uatu, availability: present, registered: true, running: false, locked: false, sourceRef: main }
              refs: { local: [main, release], remote: [origin/main], fetchedAt: null }
    WorktreeOperation:
      description: |
        The operation's own outcome. A refusal is a completed request and
        answers 200 with `ok: false` and a sanitized error; HTTP statuses
        report transport-level problems only.
      headers: { Cache-Control: { schema: { type: string, const: no-store } } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/WorktreeOperationResult' }
          examples:
            created:
              summary: Created and left stopped
              value:
                ok: true
                operationId: 1f2e3d4c-5b6a-4978-8695-a4b3c2d1e0f9
                kind: create
                phase: complete
                registered: true
                started: false
                checkout: { checkoutId: 7c2d, repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e, workspaceId: feature-login, parentWorkspaceId: atlas, path: /src/atlas.worktrees/feature-login, branch: feature/login, detached: false, main: false, ownership: uatu, availability: present, registered: true, running: false, locked: false, sourceRef: main }
            refused:
              summary: Refused without force, naming the existing checkout
              value:
                ok: false
                operationId: 2a3b4c5d-6e7f-4801-9234-5f6e7d8c9b0a
                kind: create
                phase: validating
                error: { code: branch-in-use, message: That branch is checked out in another worktree. Open that checkout instead., retry: open-existing, conflictCheckoutId: 7c2d, phase: validating }
  schemas:
    NotificationEnrollment:
      type: object
      required: [subscription, workspaceIds, needsAnswer, completed]
      properties:
        id: { type: string, maxLength: 128 }
        subscription:
          type: object
          required: [endpoint, keys]
          properties:
            endpoint: { type: string, format: uri, maxLength: 4096 }
            expirationTime: { type: [number, 'null'] }
            keys:
              type: object
              required: [p256dh, auth]
              properties:
                p256dh: { type: string }
                auth: { type: string }
        workspaceIds: { type: array, maxItems: 256, items: { type: string } }
        allWorkspaces:
          type: boolean
          default: false
          description: Cover every accessible workspace, including ones registered later, instead of `workspaceIds`.
        needsAnswer: { type: boolean }
        completed: { type: boolean }
    NotificationState:
      type: object
      required: [configured, publicKey, device]
      additionalProperties: false
      properties:
        configured: { type: boolean }
        publicKey: { type: [string, 'null'] }
        device:
          oneOf:
            - { type: 'null' }
            - type: object
              required: [id, allWorkspaces, workspaceIds, needsAnswer, completed, active]
              additionalProperties: false
              properties:
                id: { type: string }
                allWorkspaces: { type: boolean, description: True when the device covers every accessible workspace as a standing rule; `workspaceIds` then holds the explicit selection it overrides. }
                workspaceIds: { type: array, items: { type: string } }
                needsAnswer: { type: boolean }
                completed: { type: boolean }
                active: { type: boolean }
    Error:
      type: object
      required: [error]
      properties: { error: { type: string }, needsInit: { type: boolean } }
      additionalProperties: false
    Accepted:
      type: object
      required: [accepted]
      properties: { accepted: { type: boolean, const: true } }
      additionalProperties: false
    RevocationResult:
      type: object
      required: [revoked]
      properties: { revoked: { type: boolean }, current: { type: boolean } }
      additionalProperties: false
    WorkspaceId: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    ViewMode: { enum: [rendered, source, diff] }
    PersonalState:
      type: object
      required: [version]
      properties: { version: { const: 1 }, documentPath: { type: string }, follow: { type: boolean }, previewMode: { $ref: '#/components/schemas/ViewMode' }, compareTarget: { enum: [base, last-commit] }, filesFilter: { enum: [all, changed] }, lastPtyId: { type: string, format: uuid } }
      additionalProperties: false
    PersonalStatePatch:
      type: object
      properties: { version: { const: 1 }, documentPath: { type: [string, 'null'] }, follow: { type: [boolean, 'null'] }, previewMode: { oneOf: [{ $ref: '#/components/schemas/ViewMode' }, { type: 'null' }] }, compareTarget: { enum: [base, last-commit, null] }, filesFilter: { enum: [all, changed, null] }, lastPtyId: { oneOf: [{ type: string, format: uuid }, { type: 'null' }] } }
      additionalProperties: false
    CredentialId: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
    CredentialToolName: { enum: [ssh, ssh-agent, ssh-add, ssh-keygen, gpg, gpgconf, git, gh, glab] }
    NativeLoginRequest:
      type: object
      required: [name, password]
      properties: { name: { type: string }, password: { type: string }, deviceLabel: { type: string } }
      additionalProperties: false
    NativeLoginResponse:
      type: object
      required: [sessionId, user]
      properties: { sessionId: { type: string }, user: { type: string } }
      additionalProperties: false
    CompatibilityMetadata:
      type: object
      required: [hubApiRevision, workspaceApiRevision]
      properties: { hubApiRevision: { type: integer, minimum: 1 }, workspaceApiRevision: { type: integer, minimum: 1 } }
      additionalProperties: false
      description: Public Hub and proxied workspace compatibility identities.
    HubState:
      type: object
      required: [version, hubApiRevision, workspaceApiRevision, workspaces]
      properties:
        version: { type: string }
        hubApiRevision: { type: integer, minimum: 1 }
        workspaceApiRevision: { type: integer, minimum: 1 }
        workspaces:
          type: array
          items: { $ref: '#/components/schemas/HubWorkspace' }
        workspaceDefaults: { $ref: '#/components/schemas/WorkspaceDefaults' }
        worktreeNavigation: { type: string, minLength: 1, description: "Present when this Hub serves worktree operations. The origin-rooted path of the server-rendered worktree presentation the workspace picker and dashboard open. Its operations are a browser form flow, not part of this contract." }
        worktreeConfigureNavigation: { type: string, minLength: 1, description: "Present with worktreeNavigation. The origin-rooted page where a main workspace's credentials, which its linked worktrees inherit, are managed." }
      additionalProperties: false
    HubWorkspace:
      type: object
      required: [id, displayName, path, backend, running, credentialRestartRequired, credentialAssignments, workspaceApiRevision]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName' }
        path: { type: string }
        backend: { type: string, const: local }
        running: { type: boolean }
        credentialRestartRequired: { type: boolean, description: "Whether changed credential assignments require this running workspace to restart before its generated credential configuration is current." }
        credentialAssignments: { $ref: '#/components/schemas/WorkspaceCredentialAssignmentSummary' }
        workspaceApiRevision: { type: integer, minimum: 1, description: "Workspace API revision spoken by this workspace's child. Matches the top-level workspaceApiRevision for the local backend; backends running children of other builds report the child's own revision." }
        shells: { type: array, items: { type: object, required: [attached, label], properties: { attached: { type: boolean }, label: { type: string } }, additionalProperties: false } }
        parentId: { $ref: '#/components/schemas/WorkspaceId', description: "Present for a registered linked worktree. The main workspace it belongs to, whose credentials and shared configuration it inherits live. Its own `credentialAssignments` stay its own rows, normally none; read the parent's for the inherited policy." }
        repositoryId: { type: string, minLength: 1, description: "Opaque canonical repository identity shared by a main workspace and its linked worktrees. Group by this and `parentId`, never by names or paths. Absent when unknown." }
        branch: { type: string, minLength: 1, description: "The checkout's current local branch, read from its HEAD. For a linked worktree it is also its name. Absent when detached or unknown." }
        detached: { type: boolean, const: true, description: "Present when the checkout's HEAD is detached." }
        sourceRef: { type: string, minLength: 1, description: "Linked worktrees only. The recorded ref the branch was created from, when Uatu created it. Never inferred from upstream or history; absent means origin unknown." }
        ownership: { type: string, enum: [uatu, external, uncertain], description: "Linked worktrees only. `uatu` for a checkout with verified Uatu creation provenance, which alone can be deleted through Uatu." }
        availability: { type: string, enum: [missing, replaced], description: "Linked worktrees only, present when the registered checkout is not at its path (`missing`) or the path holds a different checkout (`replaced`). Such a workspace cannot start until resolved outside Uatu." }
        createWorktree: { type: string, minLength: 1, description: "Present for a main checkout that can host linked worktrees. The origin-rooted presentation path the fork action opens." }
      additionalProperties: false
    WorkspaceCredentialAssignmentSummary:
      type: object
      required: [authentication, signing]
      properties:
        authentication: { type: array, uniqueItems: true, items: { type: string, minLength: 1 }, description: "Deduplicated public names of credentials assigned for Git authentication, regardless of current usability." }
        signing: { type: array, uniqueItems: true, items: { type: string, minLength: 1 }, description: "Deduplicated public names of credentials assigned for commit signing, regardless of current usability." }
      additionalProperties: false
    BrowseResult:
      type: object
      required: [path, parent, dirs]
      properties:
        path: { type: string }
        parent: { type: [string, 'null'] }
        dirs:
          type: array
          items: { type: object, required: [name, git, registeredId, displayName, running], properties: { name: { type: string }, git: { type: boolean }, registeredId: { oneOf: [{ $ref: '#/components/schemas/WorkspaceId' }, { type: 'null' }] }, displayName: { oneOf: [{ $ref: '#/components/schemas/WorkspaceDisplayName' }, { type: 'null' }], description: "Registered workspace display name; null for unregistered directories." }, running: { type: boolean, description: "Whether the registered workspace currently has a live session. Always false for unregistered directories." } }, additionalProperties: false }
      additionalProperties: false
    FolderName:
      type: string
      minLength: 1
      pattern: '^(?!\.)(?![\s\S]*[\\/\p{Cc}\p{Cf}])[\s\S]*\S[\s\S]*$'
      description: >-
        A visible, non-hidden single path segment. Dot-prefixed names, path separators, control characters
        (Cc — the C0 range, DEL, and the C1 range U+0080–U+009F), Unicode format characters (Cf — the
        zero-width family, the bidi embedding and override controls, the BOM, and the tag characters), and
        names made only of whitespace or format characters are rejected: none of them survive a nonempty
        check, and a bidi control can make a folder display a name other than the path it occupies. The
        pattern is a Unicode-mode expression, as JSON Schema requires, so its `\p{Cc}` and `\p{Cf}` escapes
        cover the whole categories, format characters above the BMP included; it accepts exactly the names the
        server accepts.
    CreateFolderRequest:
      type: object
      required: [parent, name]
      properties:
        parent: { type: string, minLength: 1, description: Absolute path of the existing direct parent directory. }
        name: { $ref: '#/components/schemas/FolderName' }
      additionalProperties: false
    RenameFolderRequest:
      type: object
      required: [path, name]
      properties:
        path: { type: string, minLength: 1, description: Absolute path of the direct non-symbolic-link directory to rename. }
        name: { $ref: '#/components/schemas/FolderName' }
        stop: { type: boolean, default: false, description: Authorizes stopping all affected workspace sessions before mutation. }
      additionalProperties: false
    RemoveFolderRequest:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: Absolute path of the empty direct non-symbolic-link directory to remove. }
        stop: { type: boolean, default: false, description: Authorizes stopping the affected workspace session before mutation. }
      additionalProperties: false
    CreateFolderResult:
      type: object
      required: [path]
      properties: { path: { type: string, minLength: 1, description: Absolute path of the created folder. } }
      additionalProperties: false
    RenameFolderResult:
      type: object
      required: [path, workspaceIds]
      properties:
        path: { type: string, minLength: 1, description: Absolute destination path. }
        workspaceIds: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/WorkspaceId' }, description: Stable ids of every registration moved with the folder. }
      additionalProperties: false
    RemoveFolderResult:
      type: object
      required: [path]
      properties:
        path: { type: string, minLength: 1, description: Absolute path removed by the operation. }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId', description: Stable id of the registration removed with the folder, when one existed. }
      additionalProperties: false
    FolderMutationError:
      type: object
      required: [error]
      properties: { error: { type: string, minLength: 1 } }
      additionalProperties: false
    FolderStopConflict:
      type: object
      required: [error, needsStop, workspaceIds]
      properties:
        error: { type: string, minLength: 1 }
        needsStop: { type: boolean, const: true }
        workspaceIds: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/WorkspaceId' }, description: Complete list of running or starting affected workspaces. }
      additionalProperties: false
    CreateWorkspaceRequest:
      type: object
      required: [path]
      properties: { path: { type: string }, init: { type: boolean }, start: { type: boolean, default: true } }
      additionalProperties: false
    WorkspaceConflict:
      allOf: [{ $ref: '#/components/schemas/Error' }]
    WorkspaceAction:
      type: object
      required: [id]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        running: { type: boolean }
        wasRunning: { type: boolean }
        forgotten: { type: boolean }
        recoveryRequired: { type: string, description: "Registration only: the workspace committed but its recovery journal could not be cleared. The workspace is registered and stopped — any requested start was not attempted — and the Hub needs a restart before starts, assignment changes, folder mutations, and further registration resume." }
      additionalProperties: false
    WorkspaceDisplayName:
      type: string
      minLength: 1
      maxLength: 64
      description: Mutable human-facing workspace label. Trimmed, 1-64 visible characters, no control characters. Never unique and never part of URLs; the stable workspace id is the routing identity.
    AuthenticationSelection:
      type: object
      required: [credentialId, host]
      properties:
        credentialId: { $ref: '#/components/schemas/CredentialId' }
        host: { type: string, minLength: 1, description: Normalized provider host this credential becomes the authentication default for. }
      additionalProperties: false
    ConfigureWorkspaceRequest:
      type: object
      required: [path, displayName]
      properties:
        path: { type: string, minLength: 1, description: Absolute path of the existing direct non-symbolic-link folder to register. }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName' }
        authentication: { type: array, items: { $ref: '#/components/schemas/AuthenticationSelection' }, description: At most one default per provider host. }
        signing: { oneOf: [{ $ref: '#/components/schemas/CredentialId' }, { type: 'null' }], description: Default commit-signing credential. }
        init: { type: boolean, default: false, description: Explicit confirmation to run `git init` on a non-Git folder. }
        start: { type: boolean, default: false, description: "Explicit start intent. Omitted or false, the workspace finishes registered and stopped." }
      additionalProperties: false
    CreateConfiguredWorkspaceRequest:
      type: object
      required: [parent, folderName, displayName]
      properties:
        parent: { type: string, minLength: 1, description: Absolute path of the existing direct parent directory. }
        folderName: { $ref: '#/components/schemas/FolderName' }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName' }
        authentication: { type: array, items: { $ref: '#/components/schemas/AuthenticationSelection' } }
        signing: { oneOf: [{ $ref: '#/components/schemas/CredentialId' }, { type: 'null' }] }
        start: { type: boolean, default: false }
      additionalProperties: false
    OnboardedWorkspace:
      type: object
      required: [id, displayName, path, backend, running]
      properties:
        id: { $ref: '#/components/schemas/WorkspaceId' }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName' }
        path: { type: string }
        backend: { type: string, const: local }
        running: { type: boolean }
      additionalProperties: false
    WorkspaceOnboardingResult:
      type: object
      required: [workspace, started, startError]
      properties:
        workspace: { $ref: '#/components/schemas/OnboardedWorkspace' }
        started: { type: boolean }
        startError: { type: [string, 'null'], description: "Non-null exactly when an explicitly requested start failed after the configuration committed; the workspace is preserved stopped for retry." }
        recoveryRequired: { type: string, description: "Present when the configuration committed but its recovery journal could not be cleared: the workspace is preserved stopped, and the Hub needs a restart before starts, assignment changes, folder mutations, and further onboarding resume." }
      additionalProperties: false
    WorkspaceOnboardingError:
      type: object
      required: [error]
      properties:
        error: { type: string, minLength: 1 }
        needsInit: { type: boolean, const: true, description: The folder is not a Git repository; re-submit with init true after user confirmation. }
