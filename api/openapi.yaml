      properties:
        path: { type: string, minLength: 1, description: Absolute path of the existing direct non-symbolic-link folder to register. }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName' }
        authentication: { type: array, items: { $ref: '#/components/schemas/AuthenticationSelection' }, description: At most one default per provider host. }
        signing: { oneOf: [{ $ref: '#/components/schemas/CredentialId' }, { type: 'null' }], description: Default commit-signing credential. }
        init: { type: boolean, default: false, description: Explicit confirmation to run `git init` on a non-Git folder. }
        start: { type: boolean, default: false, description: "Explicit start intent. Omitted or false, the workspace finishes registered and stopped." }
      additionalProperties: false
    CreateConfiguredWorkspaceRequest:
      type: object
