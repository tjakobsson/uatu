      required: [url, dest]
      properties:
        url: { type: string }
        dest: { type: string }
        folderName: { type: string, description: "Checkout folder name, independent of the workspace display name, trimmed before use. Absent, blank, or whitespace-only derives it from the clone URL. Any other value must be one visible path segment — `.`, `..`, path separators, control characters, and Unicode format characters (Cf) answer 400 — but, unlike FolderName, a dot-prefixed checkout is accepted." }
        credentialId: { $ref: '#/components/schemas/CredentialId', description: Clone authentication identity. Never retained as a workspace assignment unless explicitly requested. }
        retainAssignment: { type: boolean, default: false, description: Explicitly retain the clone credential as the workspace authentication default for its host. }
        displayName: { $ref: '#/components/schemas/WorkspaceDisplayName', description: Workspace display name; defaults from the checkout folder name. }
        retainedAuthentication: { type: array, items: { $ref: '#/components/schemas/AuthenticationSelection' }, description: "Workspace authentication defaults committed with the registration, independent of the clone identity." }
        signing: { oneOf: [{ $ref: '#/components/schemas/CredentialId' }, { type: 'null' }], description: Default commit-signing credential committed with the registration. }
        start: { type: boolean, default: false, description: "Explicit start-after-clone intent. Omitted or false, a successful clone finishes as a registered stopped workspace." }
