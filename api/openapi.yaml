      additionalProperties: false
    SetCredentialToolRequest: { type: object, required: [path], properties: { path: { type: [string, 'null'], x-uatu-maxUtf8Bytes: 32768 } }, additionalProperties: false }
    UnlockCredentialRequest: { type: object, required: [passphrase], properties: { passphrase: { type: string, maxLength: 4096, x-uatu-maxUtf8Bytes: 4096, description: "One-operation secret. Empty is valid for an unencrypted SSH key; OpenPGP unlock still requires a nonempty passphrase. Never persisted or returned." } }, additionalProperties: false }
    AuthenticationAssignmentRequest:
