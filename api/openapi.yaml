    PlanUtilizationWindow: { type: object, properties: { utilization: { type: number, minimum: 0, description: "Percent of the window used, 0-100." }, resetsAt: { type: number, minimum: 0, description: "When the window resets." } }, additionalProperties: false }
    PlanUtilization: { type: object, description: "Plan utilization the login reports (claude.ai plans only). Empty when the login reports no windows (an API-key session). Absent from a report that does not speak to the plan (a compaction's post-count, an agent that never reports it): the previous report's plan then still stands.", properties: { fiveHour: { $ref: '#/components/schemas/PlanUtilizationWindow' }, sevenDay: { $ref: '#/components/schemas/PlanUtilizationWindow' } }, additionalProperties: false }
    SubagentLine: { type: object, description: "A subagent launched by a subagent, as a line beneath the task row that launched its branch. Lines sharing a `conversationId` are one subagent given several tasks.", required: [id, parentId, description, conversationId], properties: { id: { type: string, minLength: 1, description: "The launching row's item id in its own conversation. Unique within the list." }, parentId: { type: string, minLength: 1, description: "The task row carrying the list, or an earlier line in it: what launched this subagent." }, description: { type: string, minLength: 1 }, subagent: { type: string, description: "The kind of subagent, where the launcher named one." }, conversationId: { type: string, minLength: 1, description: "The subagent's own session." }, model: { type: string }, usage: { allOf: [{ $ref: '#/components/schemas/TokenUsage' }], description: "What the subagent spent on this task alone. Absent until it has reported any." } }, additionalProperties: false }
    TokenUsage: { type: object, description: "What a message spent, as the agent reports it. Every component is optional: an absent one means the agent did not report it, which is not the same statement as zero. Window occupancy is input + cacheRead + cacheWrite; output is what came back rather than what occupies the window.", properties: { input: { type: integer, minimum: 0 }, output: { type: integer, minimum: 0 }, reasoning: { type: integer, minimum: 0 }, cacheRead: { type: integer, minimum: 0 }, cacheWrite: { type: integer, minimum: 0 }, costUsd: { type: number, minimum: 0, description: "What the message cost in USD, where the agent prices its messages (OpenCode reports one per assistant message). Not a token component. Absent means the agent did not price it, which is not the same statement as zero; zero is what OpenCode reports for a model it has no price for." } }, additionalProperties: false }
    PermissionItem: { type: object, required: [id, type, createdAt, requestId, action, resources, status], properties: { id: { type: string }, type: { const: permission }, createdAt: { type: number }, requestId: { type: string }, conversationId: { type: string, minLength: 1, maxLength: 512, description: "Conversation that owns this request. Differs from the containing conversation when a subagent's request is shown in the conversation that launched it; answers are addressed here." }, action: { type: string }, resources: { type: array, items: { type: string } }, alwaysPatterns: { type: array, items: { type: string, minLength: 1 }, description: "What the persistent approval (`approved-session`) will authorize, in the owning agent's own syntax (OpenCode `git status *`, Claude Code `Bash(git status:*)`). Distinct from `resources`: the agent derives a reusable pattern from the request, and that pattern is what it installs. Empty means the agent supplied nothing reusable; absent means it did not say. Render verbatim; never derive scope from a resource." }, status: { enum: [pending, resolved] }, outcome: { enum: [approved-once, approved-session, rejected] }, diff: { type: string, description: "Unified diff a file-edit permission would apply, when the agent attaches one. Absent for a permission with nothing to show." }, plan: { type: string, description: "The plan this approval would put into effect, as markdown (a Claude Code plan approval)." }, choices: { type: array, minItems: 1, items: { $ref: '#/components/schemas/PermissionChoice' }, description: "Agent-provided approval intents. When present they replace the generic approve pair; rejecting stays universal." }, choiceId: { type: string, description: "On resolution: the choice that approved it, when choices were offered." } }, additionalProperties: false }
    TaskProgressEntry: { type: object, required: [text, status], properties: { text: { type: string, minLength: 1 }, status: { enum: [pending, in_progress, completed] }, activeText: { type: string, description: "Present-continuous label shown while in progress, when the agent provides one." } }, additionalProperties: false }
    PermissionChoice: { type: object, required: [id, label], properties: { id: { type: string, minLength: 1, maxLength: 128 }, label: { type: string, minLength: 1 }, description: { type: string } }, additionalProperties: false }
    StructuredQuestion: { type: object, required: [prompt, header, options, multiple, allowFreeForm], properties: { prompt: { type: string }, header: { type: string }, options: { type: array, items: { type: object, required: [label, description], properties: { label: { type: string }, description: { type: string } }, additionalProperties: false } }, multiple: { type: boolean }, allowFreeForm: { type: boolean }, optional: { type: boolean, description: "The question may be answered with an empty answer array (an optional field of an elicitation form). Absent means required." } }, additionalProperties: false }
    QuestionOutcome:
      oneOf:
        - { type: object, required: [kind], properties: { kind: { const: rejected } }, additionalProperties: false }
        - { type: object, required: [kind, answers], properties: { kind: { const: answered }, answers: { type: array, maxItems: 32, description: "One answer array per question, in the same order as QuestionItem.questions. Offered option labels and, when allowFreeForm is true, ordinary custom strings are sent directly in each array; an array is empty only for a question marked optional.", items: { type: array, minItems: 0, maxItems: 32, items: { type: string, minLength: 1, maxLength: 4096, pattern: '\S' } } } }, additionalProperties: false }
    QuestionItem: { type: object, required: [id, type, createdAt, requestId, questions, status], properties: { id: { type: string }, type: { const: question }, createdAt: { type: number }, requestId: { type: string }, conversationId: { type: string, minLength: 1, maxLength: 512, description: "Conversation that owns this request. See PermissionItem.conversationId." }, questions: { type: array, items: { $ref: '#/components/schemas/StructuredQuestion' } }, status: { enum: [pending, resolved] }, outcome: { $ref: '#/components/schemas/QuestionOutcome' }, source: { enum: [dialog, elicitation], description: "Who is asking, beyond the agent's own question tool: a tool-driven blocking dialog the agent asked the host to render, or an MCP server's elicitation. Answered and rejected through the same question operations." }, intro: { type: string, minLength: 1, description: "A sentence of context shown above the form: the server and message behind an elicitation, the refusal a dialog is about." }, link: { type: string, minLength: 1, pattern: '^https?://', description: "A link the request asks the user to open (a URL-mode elicitation)." }, schema: { type: object, description: "The request as received (an elicitation's JSON schema, a dialog's kind and payload), for a reader auditing what was asked. Opaque." } }, additionalProperties: false }
    ConversationConfiguration:
      type: object
      description: Effective configuration reported for this conversation. An absent field is unknown or agent-controlled, not an invitation to select the first offered value.
      properties:
        model: { $ref: '#/components/schemas/ModelSelection' }
        mode: { type: string, minLength: 1, maxLength: 512 }
        variant: { type: string, minLength: 1, maxLength: 512, description: "Reasoning variant of `model`. Invalid without `model` in the same configuration record." }
      dependentRequired: { variant: [model] }
      additionalProperties: false
    MessageAttachment: { type: object, required: [name, mimeType], description: "An image riding a user message, referenced by workspace attachment id — never by bytes. `id` is absent on a replayed attachment whose reference could not be recovered; clients render those as labeled placeholders.", properties: { id: { type: string, minLength: 1, maxLength: 512 }, name: { type: string, minLength: 1, maxLength: 200 }, mimeType: { type: string, enum: [image/png, image/jpeg, image/gif, image/webp] } }, additionalProperties: false }
    QueuedMessage: { type: object, required: [id, text, queuedAt], description: "A submission the workspace holds until the running turn ends. Not a timeline item; it becomes one when delivered. `requestId` echoes the accepting mutation's client request id so the submitting client can reconcile.", properties: { id: { type: string }, text: { type: string, description: "Empty for an image-only message." }, queuedAt: { type: number }, requestId: { type: string }, attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/MessageAttachment' } } }, additionalProperties: false }
    ChatEvent:
      oneOf:
        - { type: object, required: [generation, sequence, conversationId, type, item], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: item.upsert }, item: { $ref: '#/components/schemas/ConversationItem' } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, itemId], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: item.remove }, itemId: { type: string } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, itemId, delta], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: item.text_delta }, itemId: { type: string }, delta: { type: string, minLength: 1 } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, status], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: conversation.status }, status: { $ref: '#/components/schemas/ConversationStatus' }, message: { type: string } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, configuration], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: conversation.configuration }, configuration: { $ref: '#/components/schemas/ConversationConfiguration' } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, conversation], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: conversation.updated }, conversation: { allOf: [{ $ref: '#/components/schemas/ConversationSummary' }], description: "Updated summary for this conversation. Its id is the event conversationId." } }, additionalProperties: false }
        - { type: object, required: [generation, sequence, conversationId, type, queued, change], description: "Restates the whole held queue after a change, so replayed or duplicated frames converge on the same state.", properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: conversation.queue }, queued: { type: array, items: { $ref: '#/components/schemas/QueuedMessage' } }, change: { type: object, required: [kind, messageId], properties: { kind: { enum: [held, removed, delivered] }, messageId: { type: string } }, additionalProperties: false } }, additionalProperties: false }
        - { $ref: '#/components/schemas/ChatResyncEvent' }
    ChatResyncEvent: { type: object, required: [generation, sequence, conversationId, type, reason], properties: { generation: { type: string }, sequence: { type: integer, minimum: 0 }, conversationId: { type: string }, type: { const: resync }, reason: { enum: [generation-changed, retention-gap, invalid-cursor, conversation-rewritten] } }, additionalProperties: false }
    DocumentMeta:
      type: object
      required: [id, name, relativePath, mtimeMs, rootId, kind]
      properties: { id: { type: string }, name: { type: string }, relativePath: { type: string }, mtimeMs: { type: number }, rootId: { type: string }, kind: { enum: [markdown, asciidoc, text, binary] } }
      additionalProperties: false
    RootGroup:
      type: object
      required: [id, label, path, docs, hiddenCount]
      properties: { id: { type: string }, label: { type: string }, path: { type: string }, docs: { type: array, items: { $ref: '#/components/schemas/DocumentMeta' } }, hiddenCount: { type: integer, minimum: 0 } }
      additionalProperties: false
    WorkspaceState:
      type: object
      required: [workspaceApiRevision, roots, repositories, compareTarget, initialFollow, defaultDocumentId, changedId, generatedAt, build, scope]
      properties:
        workspaceApiRevision: { type: integer, minimum: 1 }
        roots: { type: array, items: { $ref: '#/components/schemas/RootGroup' } }
        repositories: { type: array, items: { $ref: '#/components/schemas/RepositorySnapshot' } }
        compareTarget: { enum: [base, last-commit] }
        initialFollow: { type: boolean }
        defaultDocumentId: { type: [string, 'null'] }
        changedId: { type: [string, 'null'] }
        generatedAt: { type: number }
        build: { $ref: '#/components/schemas/BuildSummary' }
        scope: { oneOf: [{ type: object, required: [kind], properties: { kind: { const: folder } }, additionalProperties: false }, { type: object, required: [kind, documentId], properties: { kind: { const: file }, documentId: { type: string } }, additionalProperties: false }] }
        unscopedFingerprint: { type: string }
        terminal: { enum: [enabled, disabled] }
      additionalProperties: false
    BuildSummary:
      type: object
      required: [version, branch, commitSha, commitShort, release, identifier, bundledWebRevision]
      properties: { version: { type: string }, branch: { type: string }, commitSha: { type: string }, commitShort: { type: string }, release: { type: boolean }, identifier: { type: string }, bundledWebRevision: { type: integer } }
      additionalProperties: false
    RepositorySnapshot:
      type: object
      required: [id, rootPath, label, watchedRootIds, metadata, status, base, changedFiles, gitIgnoredFiles, configWarnings, message, commitLog]
      properties:
        id: { type: string }
        rootPath: { type: string }
        label: { type: string }
        watchedRootIds: { type: array, items: { type: string } }
        metadata: { type: object, additionalProperties: true }
        status: { enum: [available, non-git, unavailable] }
        base: { type: object, additionalProperties: true }
        changedFiles: { type: array, items: { type: object, additionalProperties: true } }
        gitIgnoredFiles: { type: array, items: { type: string } }
        configWarnings: { type: array, items: { type: string } }
        message: { type: [string, 'null'] }
        commitLog: { type: array, items: { type: object, additionalProperties: true } }
      additionalProperties: false
    LiveCursor:
      type: string
      x-uatu-maxUtf8Bytes: 1024
      description: "Opaque cursor scoped to one subscription, at most 1024 UTF-8 bytes. Conversation cursors are the workspace's own replay ids. The Hub assigns document, inventory, and activity cursors. An empty or absent cursor starts from the current position."
    LiveDocumentKey:
      type: string
      x-uatu-maxUtf8Bytes: 4096
      description: "The watch context as a form-urlencoded query string of `compareTarget`, `scope`, and `documentId`, in that order, each only when set. For example `compareTarget=last-commit&scope=file&documentId=README.md`. `compareTarget` is `base` or `last-commit`, `scope` is `folder` or `file`, and `scope=file` also needs `documentId`. Empty or absent means the default context. Streams that present the same key share one upstream subscription. At most 4096 UTF-8 bytes, which leaves room for a file pinned deep in the tree, since `documentId` is a URL-encoded absolute path."
    LiveConversationKey:
      type: string
      minLength: 1
      x-uatu-maxUtf8Bytes: 4096
      description: "Agent-qualified conversation id, `<agentId>:<providerConversationId>`, at most 4096 UTF-8 bytes."
    LiveSubscriptionKey:
      description: "One subscription on a stream, meaning a topic and its key where the topic has one. The activity topic is not subscribed here. Request it with the stream's `activity` parameter."
      oneOf:
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: document }
            key: { $ref: '#/components/schemas/LiveDocumentKey' }
          additionalProperties: false
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: inventory }
          additionalProperties: false
        - type: object
          required: [topic, key]
          properties:
            topic: { type: string, const: conversation }
            key: { $ref: '#/components/schemas/LiveConversationKey' }
          additionalProperties: false
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: worktrees }
          additionalProperties: false
    LiveSubscription:
      description: A subscription and the cursor to resume it from.
      oneOf:
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: document }
            key: { $ref: '#/components/schemas/LiveDocumentKey' }
            cursor: { $ref: '#/components/schemas/LiveCursor' }
          additionalProperties: false
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: inventory }
            cursor: { $ref: '#/components/schemas/LiveCursor' }
          additionalProperties: false
        - type: object
          required: [topic, key]
          properties:
            topic: { type: string, const: conversation }
            key: { $ref: '#/components/schemas/LiveConversationKey' }
            cursor: { $ref: '#/components/schemas/LiveCursor' }
          additionalProperties: false
        - type: object
          required: [topic]
          properties:
            topic: { type: string, const: worktrees }
            cursor: { $ref: '#/components/schemas/LiveCursor', description: "Ignored. The worktrees topic has no replay cursor; every attach receives a fresh invalidation." }
          additionalProperties: false
    LiveSubscriptionList:
      type: array
      maxItems: 16
      items: { $ref: '#/components/schemas/LiveSubscription' }
      description: At most 16 entries. A later entry for the same topic and key replaces an earlier one.
    LiveSubscriptionKeyList:
      type: array
      maxItems: 16
      items: { $ref: '#/components/schemas/LiveSubscriptionKey' }
    LiveSubscriptionChange:
      type: object
      properties:
        add: { $ref: '#/components/schemas/LiveSubscriptionList' }
        remove: { $ref: '#/components/schemas/LiveSubscriptionKeyList' }
      additionalProperties: false
      description: Removals apply before additions. Adding a topic and key that is already subscribed replaces the subscription and re-attaches it from the new cursor.
    LiveSubscriptionsUpdated:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }
      additionalProperties: false
    WorktreeOwnership:
      type: string
      enum: [main, uatu, external, uncertain]
      description: "How this checkout relates to Uatu. `main` is the repository's main checkout. `uatu` means verified Uatu creation provenance, which alone may be deleted through Uatu. `external` is somebody else's tree, whether or not it is registered. `uncertain` means the recorded identity could not be confirmed; its content is retained and destructive actions are refused. Never inferred from a name, a path, or the presence of an agent's configuration directory."
    WorktreeAvailability:
      type: string
      enum: [present, missing, replaced]
      description: "`present` is the ordinary case. `missing` is a registered path that is not there; `replaced` is a path occupied by a different checkout. Neither is ever silently repaired, and neither can start."
    WorktreeCheckout:
      type: object
      required: [checkoutId, repositoryId, path, branch, detached, main, ownership, availability, registered, running, locked]
      properties:
        checkoutId: { type: string, minLength: 1, description: "Canonical identity of this checkout. Ownership and every destructive action are decided on this, never on a path: a path reused by another tree must not inherit an older record's ownership." }
        repositoryId: { type: string, minLength: 1, description: "Canonical repository identity shared by a main checkout and its linked worktrees. Group by this, never by names or paths." }
        workspaceId: { $ref: '#/components/schemas/WorkspaceId', description: "The Hub registration, present only once registered. Present exactly when `registered` is true." }
        parentWorkspaceId: { $ref: '#/components/schemas/WorkspaceId', description: "The registered main workspace this checkout belongs to, when known. It owns the credential policy this checkout inherits live." }
        path: { type: string, minLength: 1 }
        branch: { type: [string, 'null'], minLength: 1, description: "The exact local branch, slashes included; for a linked worktree it is also its display name. Null for a detached or unreadable HEAD, which is stated rather than guessed." }
        detached: { type: boolean }
        main: { type: boolean, description: "Whether this is the repository's main checkout. A main checkout is never deletable through Uatu." }
        ownership: { $ref: '#/components/schemas/WorktreeOwnership' }
        availability: { $ref: '#/components/schemas/WorktreeAvailability' }
        registered: { type: boolean }
        running: { type: boolean }
        locked: { type: boolean, description: "Whether Git reports the checkout locked. A locked checkout is never removed." }
        sourceRef: { type: string, minLength: 1, description: "Immutable branch-creation snapshot: the ref explicitly selected when Uatu created this branch. Not the upstream and not the starting revision, and never inferred from either. Absent means the origin is unknown." }
        upstream: { type: string, minLength: 1 }
        head: { type: string, minLength: 1, description: "Short revision, for diagnostics. Never provenance." }
      additionalProperties: false
    WorktreeRefs:
      type: object
      required: [local, remote, fetchedAt]
      properties:
        local: { type: array, items: { type: string, minLength: 1 } }
        remote: { type: array, items: { type: string, minLength: 1 }, description: "Remote-qualified, such as origin/release." }
        fetchedAt: { type: [integer, 'null'], description: "Unix epoch milliseconds of the last successful fetch in this Hub run, or null when the listing comes from repository state alone. A cached listing is never network-fresh." }
      additionalProperties: false
    WorktreeErrorCode:
      type: string
      enum: [invalid-input, git-unsupported, not-found, branch-exists, branch-in-use, destination-occupied, ref-unavailable, fetch-authentication, fetch-network, registration-failed, start-failed, local-data, git-lock, external-activity, nested-dependency, stop-failed, ownership-required, identity-uncertain, inventory-unavailable, folder-dependency, folder-dependency-unknown, conflict, permission-denied, timeout, cancelled, internal]
      description: "The closed set of refusals. A client that cannot map a code refuses rather than inventing a recovery."
    WorktreeRetryAction:
      type: string
      enum: [none, retry-registration, retry-start, retry-fetch, retry-delete, refresh, open-existing]
      description: "The one follow-up the originating flow offers. `none` means there is none; it is never a licence to force."
    WorktreePhase:
      type: string
      enum: [validating, reserving, creating, verifying, registering, assigning, starting, preflight, fencing, stopping, rechecking, removing, unregistering, complete]
      description: "The last boundary the operation provably passed. Not a progress percentage: it is what restart recovery reconciles against actual Git state. Create phases run validating to complete; delete phases preflight to complete; unphased kinds report only complete."
    WorktreeError:
      type: object
      required: [code, message, retry]
      properties:
        code: { $ref: '#/components/schemas/WorktreeErrorCode' }
        message: { type: string, minLength: 1, maxLength: 300, description: "Already sanitized: no absolute path, no credential, no control character, bounded length. Safe to show a user verbatim." }
        retry: { $ref: '#/components/schemas/WorktreeRetryAction' }
        conflictCheckoutId: { type: string, minLength: 1, description: "The existing checkout an occupancy conflict points at, to open instead of forcing." }
        retainedCheckoutId: { type: string, minLength: 1, description: "A checkout that outlived a failed operation and must not be recreated." }
        phase: { $ref: '#/components/schemas/WorktreePhase' }
      additionalProperties: false
    WorktreeInventoryResponse:
      type: object
      required: [inventory]
      properties:
        inventory:
          type: object
          required: [repositoryId, sourceWorkspaceId, status, checkouts, refs]
          properties:
            repositoryId: { type: string, minLength: 1, description: "The reserved word `unknown` when the repository could not be identified at all, which is legal only on an explicitly stale error listing with no checkouts." }
            sourceWorkspaceId: { $ref: '#/components/schemas/WorkspaceId' }
            status: { type: string, enum: [ready, loading, error] }
            checkouts: { type: array, items: { $ref: '#/components/schemas/WorktreeCheckout' } }
            refs: { $ref: '#/components/schemas/WorktreeRefs' }
            error: { $ref: '#/components/schemas/WorktreeError', description: "Present when status is error: the listing shown is explicitly stale." }
          additionalProperties: false
      additionalProperties: false
    WorktreeOperationResult:
      type: object
      required: [ok, operationId, kind]
      properties:
        ok: { type: boolean }
        operationId: { type: string, minLength: 1 }
        kind: { type: string, enum: [create, register, start, fetch, refresh, delete, forget] }
        phase: { $ref: '#/components/schemas/WorktreePhase' }
        checkout: { $ref: '#/components/schemas/WorktreeCheckout' }
        registered: { type: boolean }
        started: { type: boolean }
        startError: { $ref: '#/components/schemas/WorktreeError', description: "An explicitly requested start that failed. It does not fail the operation: the workspace remains configured and stopped." }
        error: { $ref: '#/components/schemas/WorktreeError' }
        retainedCheckout: { $ref: '#/components/schemas/WorktreeCheckout', description: "Present when Git succeeded and a later step did not. Retry acts on this checkout; a second one is never created." }
      additionalProperties: false
      description: "A successful result carries phase, registered and started; a refusal carries error, and retainedCheckout when a checkout outlived it."
    CreateWorktreeRequest:
      type: object
      required: [mode]
      properties:
        sourceWorkspaceId: { $ref: '#/components/schemas/WorkspaceId', description: "Required for a Hub session. Optional for a worktree capability, which names one repository family already." }
        mode: { type: string, enum: [new-branch, existing-local, remote-tracking] }
        branch: { type: string, minLength: 1, description: "The target local branch. Required for new-branch. For the other modes the Hub derives it — the existing local ref, or the remote ref minus its remote prefix — and rejects a mismatching guess. Held to Git's branch grammar before any repository is touched, so an option-like name or a revision expression never reaches a Git argument list." }
        base:
          type: object
          required: [kind, ref]
          properties:
            kind: { type: string, enum: [local, remote] }
            ref: { type: string, minLength: 1 }
          additionalProperties: false
          description: "An exactly qualified starting ref. Mutually exclusive with baseRef."
        baseRef: { type: string, minLength: 1, description: "A starting ref left for the Hub to qualify against the repository's own listing, for callers that have one name rather than a committed selection — feature/login is a valid local branch and origin/main a remote-qualified one, and only the listing tells them apart. A ref that is not in the listing is refused; one that is both is refused as ambiguous. Nothing is substituted for a near match. Ignored when base is present." }
        start: { type: boolean, description: "Post-commit intent. Creation leaves the workspace stopped by default, and a failed start does not fail the creation." }
      additionalProperties: false
    OpenWorktreeRequest:
      type: object
      required: [reference]
      properties:
        sourceWorkspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        reference: { $ref: '#/components/schemas/WorktreeReference' }
        start: { type: boolean }
      additionalProperties: false
    DeleteWorktreeRequest:
      type: object
      required: [reference, confirm]
      properties:
        sourceWorkspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        reference: { $ref: '#/components/schemas/WorktreeReference' }
        confirm: { type: boolean, const: true, description: "Required, and itself the authorization — the same role the destructive button plays in the Hub's dialog. It authorizes the stated operation; it does not override any blocker, and there is no force anywhere in this family." }
        stop: { type: boolean, description: "Additionally authorizes stopping this worktree's own Uatu sessions before removal. Activity Uatu does not own stays a blocker: Uatu never claims it can stop an external application." }
      additionalProperties: false
    WorktreeReference:
      type: string
      minLength: 1
      description: "A registered workspace id, a canonical checkout id, or the exact branch of exactly one linked checkout in this repository family. A branch is resolved against the authoritative inventory and yields a canonical identity, which is what every safety check then runs on — so a stale name can never address a path's new occupant. A branch matching more than one checkout is refused as ambiguous."
