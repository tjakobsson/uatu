    CloneJob:
      type: object
      required: [jobId]
      properties: { jobId: { type: string } }
      additionalProperties: false
    CloneJobInput:
      type: object
      required: [input]
      properties: { input: { type: string, description: "At most 8192 bytes UTF-8 encoded (a byte limit, not a character count); larger payloads are rejected with 413." } }
      additionalProperties: false
    CloneJobCancelResult:
      type: object
      required: [status]
      properties: { status: { enum: [cancelled, terminal] } }
      additionalProperties: false
    EmptyObject: { type: object, additionalProperties: false }
    ChatAgentDescriptor: { type: object, required: [id, name], description: "The identity of one offered agent. Capabilities ride the agent's availability, which only exists once its runtime has spoken.", properties: { id: { type: string, minLength: 1, maxLength: 64, pattern: '^[^:]+$' }, name: { type: string, minLength: 1, maxLength: 512 } }, additionalProperties: false }
    ConversationStatus: { enum: [idle, sending, running, completed, interrupted, failed, background, retrying, compacting], description: "`background`: no turn is running but the agent still holds live background work; prompting is possible. Presented only for agents declaring `background-tasks`. `retrying` and `compacting` are live-turn states with a name: the agent is waiting to retry a failed API request, or compacting its context; both return to `running` when the turn resumes." }
    ModelSelection: { type: object, required: [providerId, modelId], properties: { providerId: { type: string, minLength: 1, maxLength: 512 }, modelId: { type: string, minLength: 1, maxLength: 512 } }, additionalProperties: false }
    ConversationSummary:
      type: object
      required: [id, title, createdAt, updatedAt, status, agent]
      description: "`id` is agent-qualified (`<agentId>:<providerConversationId>`); ids from different agents never collide. `agent` names the owner, fixed at creation for the conversation's lifetime."
      properties: { id: { type: string, minLength: 1, maxLength: 512 }, title: { type: string }, createdAt: { type: number, minimum: 0 }, updatedAt: { type: number, minimum: 0 }, status: { $ref: '#/components/schemas/ConversationStatus' }, agent: { $ref: '#/components/schemas/ChatAgentDescriptor' } }
      additionalProperties: false
    ConversationInventoryEvent: { type: object, required: [type], properties: { type: { const: conversation.inventory } }, additionalProperties: false }
    TimelineBase: { type: object, required: [id, type, createdAt], properties: { id: { type: string }, type: { type: string }, createdAt: { type: number, minimum: 0 } } }
    ConversationItem:
      oneOf:
        - { type: object, required: [id, type, createdAt, text], properties: { id: { type: string }, type: { const: user_message }, createdAt: { type: number }, text: { type: string }, requestId: { type: string }, attachments: { type: array, maxItems: 8, items: { $ref: '#/components/schemas/MessageAttachment' } } }, additionalProperties: false }
        - { type: object, required: [id, type, createdAt, markdown], properties: { id: { type: string }, type: { const: assistant_message }, createdAt: { type: number }, markdown: { type: string }, completedAt: { type: number }, usage: { allOf: [{ $ref: '#/components/schemas/TokenUsage' }], description: "Message-level tokens. Normalization emits exactly one dedicated carrier per reported provider message: its id is `usage:<provider-message-id>` and its markdown is empty, so clients MUST treat it as data rather than render it as a message bubble. Present only where the agent declares the context capability and reported usage." }, model: { allOf: [{ $ref: '#/components/schemas/ModelSelection' }], description: "The model that reported this usage carrier, when known. Context percentages MUST use this model's context limit rather than a newly selected model that has not produced usage yet." } }, additionalProperties: false }
        - { type: object, required: [id, type, createdAt, text, status], properties: { id: { type: string }, type: { const: reasoning }, createdAt: { type: number }, text: { type: string }, status: { enum: [pending, running, completed, failed, cancelled] }, durationMs: { type: number }, label: { type: string, minLength: 1, description: "The row's label when it is recalled context rather than the model's own thinking (\"Recalled from memory\"). Absent for ordinary reasoning." } }, additionalProperties: false }
        - { type: object, required: [id, type, createdAt, name, status], properties: { id: { type: string }, type: { const: tool }, createdAt: { type: number }, name: { type: string }, status: { enum: [pending, running, completed, failed, cancelled] }, input: { type: string }, output: { type: string }, error: { type: string }, childConversationId: { type: string }, model: { type: string, description: "For a task tool: the model the subagent's own session ran, mirrored from that child session. A subagent may run a different model from its parent." }, usage: { allOf: [{ $ref: '#/components/schemas/TokenUsage' }], description: "For a task tool: the tokens the subagent consumed, aggregated across its child session's messages. Absent until it has reported any." }, elapsedMs: { type: number, minimum: 0, description: "How long the tool has been running, from the agent's own progress heartbeat, for a tool still producing no output." } }, additionalProperties: false }
        - { type: object, required: [id, type, createdAt, command, status], properties: { id: { type: string }, type: { const: command }, createdAt: { type: number }, command: { type: string }, status: { enum: [pending, running, completed, failed, cancelled] }, output: { type: string }, exitCode: { type: integer } }, additionalProperties: false }
        - { type: object, required: [id, type, createdAt, path, operation], properties: { id: { type: string }, type: { const: file_change }, createdAt: { type: number }, path: { type: string }, operation: { enum: [create, update, delete] }, additions: { type: integer, minimum: 0 }, deletions: { type: integer, minimum: 0 } }, additionalProperties: false }
        - { $ref: '#/components/schemas/PermissionItem' }
