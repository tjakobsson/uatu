openapi: 3.1.0
info:
  title: UatuCode public API
  version: 7.20.0-experimental
  license: { name: MIT, identifier: MIT }
  summary: Hub revision 7 and workspace revision 20
  description: |
    Canonical HTTP contract for the UatuCode Hub API, the only public API.
    Under `/s/{workspaceId}/` the Hub serves one family itself, personal
    state, and it is part of this contract. Everything else under that
    prefix is the internal protocol between the Hub, the workspace child,
    and the web client shipped in the same build, and `exclusions.yaml`
    lists it. Workspace payloads reach public clients
    as topics of the Hub's live stream, and the workspace revision versions
    those payloads. `streaming.yaml` defines streaming messages and lifecycle
    rules.

    `info.version` encodes the revision pair as `<hub>.<workspace>.0` with an
    `-experimental` tag while stability is experimental; `x-uatu-revisions`
    is the authoritative machine-readable pair, and the product version of a
    published snapshot is recorded in that snapshot's `contract.json`.
  x-uatu-revisions:
    hubApiRevision: 7
    workspaceApiRevision: 20
servers:
  - url: https://{hubHost}
    variables:
      hubHost: { default: uatu.example.test }
tags:
  - { name: Hub authentication, description: Native JSON session creation and revocation. }
  - { name: Hub, description: "Workspace registry, lifecycle, browsing, device sessions, and per-user workspace state." }
  - { name: Hub credentials, description: "Hub-managed credentials, workspace assignments, and credential-tool readiness." }
  - { name: Clone jobs, description: "Asynchronous clone creation, interaction, cancellation, and events." }
  - { name: Live stream, description: "One SSE connection per client for document state, conversation inventory and events, and cross-workspace activity." }
  - { name: Worktrees, description: "Git worktrees of a workspace's repository as independent workspaces: authoritative inventory, creation, opening and guarded deletion. The Hub's own interface and an agent-invoked CLI perform the same operations through this family." }
security:
  - hubBearer: []
  - hubCookie: []
paths:
  /api/hub/notifications:
    get:
      operationId: hubGetNotifications
      tags: [Hub]
      summary: Read push configuration and this user's device enrollment
      parameters:
        - { name: device, in: query, schema: { type: string, maxLength: 128 } }
      responses:
        '200':
          description: Push support and the selected device, without endpoint or private keys
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationState' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '500': { $ref: '#/components/responses/NoStoreError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
    put:
      operationId: hubEnrollNotifications
      tags: [Hub]
      summary: Enroll or reconcile a browser push subscription and device preferences
      description: Requires an explicit user enrollment action. Cookie requests require same-origin CSRF validation. Enrollment is authorized by the current login session; expiry or revocation stops future sends until reconciliation. With `allWorkspaces` true the device covers every workspace the login can reach, including workspaces registered later; `workspaceIds` is still validated and stored so the explicit selection is restored when the rule is turned off. Enrollment waits for the feed position of every running covered workspace before saving.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationEnrollment' }
      responses:
        '200':
          description: Device enrollment saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationState' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '409': { $ref: '#/components/responses/NoStoreError' }
        '413': { $ref: '#/components/responses/NoStoreError' }
        '500': { $ref: '#/components/responses/NoStoreError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
    delete:
      operationId: hubRemoveNotifications
      tags: [Hub]
      summary: Disable notifications for an owned device
      parameters:
        - { name: device, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      responses:
        '200':
          description: Device removed and unsent notifications cancelled
          content:
            application/json:
              schema: { type: object, required: [removed], additionalProperties: false, properties: { removed: { const: true } } }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '500': { $ref: '#/components/responses/NoStoreError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
  /login:
    post:
      operationId: hubLogin
      tags: [Hub authentication]
      summary: Create a native Hub session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeLoginRequest' }
            example: { name: alice, password: secret, deviceLabel: Alice's Mac }
      responses:
        '200':
          description: Session issued. The session ID is also set as a cookie.
          headers:
            Set-Cookie: { schema: { type: string } }
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeLoginResponse' }
              example: { sessionId: token-value, user: alice }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '429': { $ref: '#/components/responses/NoStoreError' }
  /logout:
    post:
      operationId: hubLogout
      tags: [Hub authentication]
      summary: Revoke the bearer session
      security: [{ hubBearer: [] }]
      responses:
        '200': { $ref: '#/components/responses/Revoked' }
        '403': { $ref: '#/components/responses/Error' }
  /api/hub/state:
    get:
      operationId: hubGetState
      tags: [Hub]
      summary: Read Hub state and registered workspaces
      responses:
        '200':
          description: Hub state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HubState' }
              examples:
                ordinary:
                  summary: An ordinary workspace
                  value:
                    version: 0.5.1 (abcdef0)
                    hubApiRevision: 7
                    workspaceApiRevision: 19
                    workspaces: [{ id: uatu, displayName: Uatu Docs, path: /src/uatu, backend: local, running: true, credentialRestartRequired: false, credentialAssignments: { authentication: [Work GitHub], signing: [Work signing] }, workspaceApiRevision: 19, shells: [{ attached: false, label: zsh }] }]
                    workspaceDefaults: { configured: /srv/workspaces, configuredAvailable: true, effective: /srv/workspaces }
                worktrees:
                  summary: A main workspace and one linked worktree
                  value:
                    version: 0.5.1 (abcdef0)
                    hubApiRevision: 7
                    workspaceApiRevision: 19
                    worktreeNavigation: /worktrees
                    worktreeConfigureNavigation: /settings
                    workspaces:
                      - { id: atlas, displayName: Atlas, path: /src/atlas, backend: local, running: true, credentialRestartRequired: false, credentialAssignments: { authentication: [Work GitHub], signing: [] }, workspaceApiRevision: 19, repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e, branch: main, createWorktree: /worktrees?view=create&source=atlas }
                      - { id: feature-login, displayName: feature/login, path: /src/atlas.worktrees/feature-login, backend: local, running: false, credentialRestartRequired: false, credentialAssignments: { authentication: [], signing: [] }, workspaceApiRevision: 19, parentId: atlas, repositoryId: 5f0c2a9d4e1b7a3c6d8e9f0a1b2c3d4e, branch: feature/login, sourceRef: main, ownership: uatu }
        '401': { $ref: '#/components/responses/Error' }
  /api/hub/browse:
    get:
      operationId: hubBrowse
      tags: [Hub]
      summary: List child directories on the Hub host
      parameters:
        - { name: path, in: query, schema: { type: string }, description: Absolute directory path; defaults to the Hub user's home directory. }
      responses:
        '200':
          description: Directory listing
          content:
            application/json: { schema: { $ref: '#/components/schemas/BrowseResult' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/hub/folders/create:
    post:
      operationId: hubCreateFolder
      tags: [Hub]
      summary: Create an empty child folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateFolderRequest' }
            example: { parent: /src, name: new-project }
      responses:
        '200':
          description: Folder created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateFolderResult' }
              example: { path: /src/new-project }
        '400': { $ref: '#/components/responses/FolderMutationError' }
        '401': { $ref: '#/components/responses/FolderMutationError' }
        '403': { $ref: '#/components/responses/FolderMutationError' }
        '404': { $ref: '#/components/responses/FolderMutationError' }
        '409': { $ref: '#/components/responses/FolderMutationError' }
        '500': { $ref: '#/components/responses/FolderMutationError' }
  /api/hub/folders/rename:
    post:
      operationId: hubRenameFolder
      tags: [Hub]
      summary: Rename a folder to an unused sibling name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RenameFolderRequest' }
            example: { path: /src/old-project, name: new-project, stop: true }
      responses:
        '200':
          description: Folder renamed and affected workspace paths updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RenameFolderResult' }
              example: { path: /src/new-project, workspaceIds: [old-project] }
        '400': { $ref: '#/components/responses/FolderMutationError' }
        '401': { $ref: '#/components/responses/FolderMutationError' }
        '403': { $ref: '#/components/responses/FolderMutationError' }
        '404': { $ref: '#/components/responses/FolderMutationError' }
        '409':
          description: The destination or another operation conflicts, the folder is not empty, or affected sessions need explicit stop authorization.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/FolderMutationError' }
                  - { $ref: '#/components/schemas/FolderStopConflict' }
              examples:
                destinationExists: { value: { error: destination already exists } }
                needsStop: { value: { error: affected workspace sessions must be stopped, needsStop: true, workspaceIds: [old-project] } }
        '500': { $ref: '#/components/responses/FolderMutationError' }
  /api/hub/folders/remove:
    post:
      operationId: hubRemoveFolder
      tags: [Hub]
      summary: Remove an empty folder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemoveFolderRequest' }
            example: { path: /src/old-project, stop: true }
      responses:
        '200':
          description: Empty folder removed, with its workspace registration when present
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RemoveFolderResult' }
              examples:
                unregistered: { value: { path: /src/empty-folder } }
                registered: { value: { path: /src/old-project, workspaceId: old-project } }
        '400': { $ref: '#/components/responses/FolderMutationError' }
        '401': { $ref: '#/components/responses/FolderMutationError' }
        '403': { $ref: '#/components/responses/FolderMutationError' }
        '404': { $ref: '#/components/responses/FolderMutationError' }
        '409':
          description: The folder is not empty, another operation conflicts, or an affected session needs explicit stop authorization.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/FolderMutationError' }
                  - { $ref: '#/components/schemas/FolderStopConflict' }
              examples:
                notEmpty: { value: { error: folder is not empty } }
                needsStop: { value: { error: affected workspace sessions must be stopped, needsStop: true, workspaceIds: [old-project] } }
        '500': { $ref: '#/components/responses/FolderMutationError' }
  /api/hub/workspaces:
    post:
      operationId: hubCreateWorkspace
      tags: [Hub]
      summary: Register and optionally start a workspace
      description: |
        A registration that commits but whose recovery journal cannot be
        cleared answers 200 with `recoveryRequired` instead of an error: the
        workspace is registered and stopped, a requested start was not
        attempted, and every further workspace change is refused until the
        Hub restarts and recovers.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkspaceRequest' }
            example: { path: /src/uatu, start: true }
      responses:
        '200': { $ref: '#/components/responses/WorkspaceAction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Initialization confirmation required, target reserved, or a pending folder mutation awaits recovery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceConflict' }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/workspaces/configure:
    post:
      operationId: hubConfigureWorkspace
      tags: [Hub]
      summary: Register an existing folder as a configured stopped workspace
      description: |
        Atomically commits the registration, display name, and selected
        credential assignments before any optional start. The default start
        intent is false; the normal result is a configured stopped workspace.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigureWorkspaceRequest' }
            example: { path: /src/payments-service, displayName: Payments API, authentication: [{ credentialId: cred-1, host: github.com }], signing: cred-2, start: false }
      responses:
        '200':
          description: The committed workspace and explicit start outcome.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingResult' }
              example: { workspace: { id: payments-service, displayName: Payments API, path: /src/payments-service, backend: local, running: false }, started: false, startError: null }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '409':
          description: Already registered, path reserved, init confirmation required, credential selection conflict, or a pending recovery journal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingError' }
        '500':
          description: Git initialization, persistence, or recovery failure. No partial registration or assignment is retained.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/workspaces/create:
    post:
      operationId: hubCreateConfiguredWorkspace
      tags: [Hub]
      summary: Create and register a new stopped Git workspace
      description: |
        Creates one visible child folder under an absolute parent without
        replacing anything, runs `git init`, and commits the registration and
        credential assignments as one result. Failures after initialization
        retain the new repository and report its path for retry through the
        configure operation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConfiguredWorkspaceRequest' }
            example: { parent: /srv/workspaces, folderName: payments-service, displayName: Payments API, start: false }
      responses:
        '200':
          description: The created, initialized, committed workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingResult' }
              example: { workspace: { id: payments-service, displayName: Payments API, path: /srv/workspaces/payments-service, backend: local, running: false }, started: false, startError: null }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '409':
          description: Destination exists, is reserved, a credential selection conflicts, or a pending recovery journal awaits Hub recovery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingError' }
        '500':
          description: Git initialization or persistence failure. `retainedPath` identifies an initialized repository that was kept.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceOnboardingError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/workspaces/{workspaceId}/display-name:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: hubUpdateWorkspaceDisplayName
      tags: [Hub]
      summary: Rename a workspace display name
      description: Changes only the mutable display name. Valid while the workspace is running or stopped; the session, folder, stable id, URL, personal state, and assignments are untouched. Refused with 409 while a recovery journal awaits Hub recovery; the check runs inside the workspace lifecycle operation, so a folder mutation cannot journal between it and the update.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceDisplayNameRequest' }
            example: { displayName: Payments API }
      responses:
        '200':
          description: The updated workspace.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceSummaryResponse' }
              example: { workspace: { id: payments-service, displayName: Payments API, path: /src/payments-service, backend: local, running: true } }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '409':
          description: A pending recovery journal awaits Hub recovery. The journal records whole registry entries, display name included, and recovery restores them verbatim — so a rename admitted now would be silently reverted at the next restart.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: a pending recovery journal requires Hub recovery before further folder changes }
        '500':
          description: The validated name could not be persisted (a retryable registry save failure, not a request problem).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: workspace display name could not be persisted }
  /api/hub/settings/workspace-defaults:
    get:
      operationId: hubGetWorkspaceDefaults
      tags: [Hub]
      summary: Read the default workspace parent preference
      responses:
        '200':
          description: Configured and effective default workspace parent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDefaults' }
              example: { configured: /srv/workspaces, configuredAvailable: true, effective: /srv/workspaces }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/NoStoreError' }
    post:
      operationId: hubUpdateWorkspaceDefaults
      tags: [Hub]
      summary: Configure or clear the default workspace parent
      description: |
        Requires an existing direct non-symbolic-link directory; the canonical
        path is persisted Hub-wide. The default guides initial create, clone,
        and browse locations only — it never constrains where workspaces may
        be registered. Null clears the preference.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWorkspaceDefaultsRequest' }
            example: { defaultWorkspaceParent: /srv/workspaces }
      responses:
        '200':
          description: The resulting configured and effective values.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkspaceDefaults' }
              example: { configured: /srv/workspaces, configuredAvailable: true, effective: /srv/workspaces }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/NoStoreError' }
        '503': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/sessions/{workspaceId}/start:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: hubStartWorkspace
      tags: [Hub]
      summary: Start a registered workspace
      description: Refused with 409 while a pending onboarding journal or a pending folder mutation awaits Hub recovery; the folder check also runs inside the workspace lifecycle operation, so a folder mutation cannot journal between it and the start.
      responses:
        '200': { $ref: '#/components/responses/WorkspaceAction' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: A pending onboarding journal or folder-mutation journal awaits Hub recovery; starts are refused so a partially configured workspace cannot run and so no session is spawned at a path recovery must still move or restore.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: a pending onboarding requires Hub recovery before session starts }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/sessions/{workspaceId}/stop:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: hubStopWorkspace
      tags: [Hub]
      summary: Stop a workspace
      responses:
        '200': { $ref: '#/components/responses/WorkspaceAction' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/hub/workspaces/{workspaceId}/forget:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: hubForgetWorkspace
      tags: [Hub]
      summary: Unregister a stopped workspace without deleting files
      responses:
        '200': { $ref: '#/components/responses/WorkspaceAction' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/workspaces/{workspaceId}/credential-assignments:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      operationId: hubAssignWorkspaceCredentials
      tags: [Hub credentials]
      summary: Atomically replace selected workspace credential defaults
      description: Authentication and signing selections commit together in one workspace lifecycle operation and one metadata transaction.
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignWorkspaceCredentialsRequest' } } } }
      responses:
        '200': { $ref: '#/components/responses/CredentialAssignments' }
        '400': { $ref: '#/components/responses/NoStoreError' }
        '401': { $ref: '#/components/responses/NoStoreError' }
        '403': { $ref: '#/components/responses/NoStoreError' }
        '404': { $ref: '#/components/responses/NoStoreError' }
        '409': { $ref: '#/components/responses/NoStoreError' }
        '500': { $ref: '#/components/responses/NoStoreError' }
  /api/hub/sessions:
    get:
      operationId: hubListDeviceSessions
      tags: [Hub]
      summary: List the current user's device sessions
      responses:
        '200':
          description: Device sessions
          content:
            application/json: { schema: { $ref: '#/components/schemas/DeviceSessionList' } }
        '401': { $ref: '#/components/responses/Error' }
  /api/hub/sessions/{sessionHandle}/revoke:
    parameters:
      - { name: sessionHandle, in: path, required: true, schema: { type: string, minLength: 1 }, description: Non-secret session handle returned by the list operation. }
    post:
      operationId: hubRevokeDeviceSession
      tags: [Hub]
      summary: Revoke one device session
      responses:
        '200': { $ref: '#/components/responses/Revoked' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/hub/credentials:
    get:
      operationId: hubListCredentials
      tags: [Hub credentials]
      summary: List public credential metadata and assignments
      responses:
        '200': { $ref: '#/components/responses/CredentialList' }
        '401': { $ref: '#/components/responses/Error' }
        '500': { $ref: '#/components/responses/Error' }
  /api/hub/credential-tools:
    get:
      operationId: hubListCredentialTools
      tags: [Hub credentials]
      summary: List credential-tool readiness
      responses:
        '200': { $ref: '#/components/responses/CredentialToolList' }
        '401': { $ref: '#/components/responses/Error' }
  /api/hub/credentials/{credentialId}/public-key:
    parameters: [{ $ref: '#/components/parameters/CredentialId' }]
    get:
      operationId: hubGetCredentialPublicKey
