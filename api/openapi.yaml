      properties:
        configured: { type: [string, 'null'], description: "The saved canonical default workspace parent, retained for diagnosis even while unavailable." }
        configuredAvailable: { type: boolean, description: Whether the configured directory is currently a readable direct directory. }
        effective: { type: string, description: "Where pathless browse/create/clone flows start: the configured parent while usable, the daemon user's home otherwise." }
      additionalProperties: false
    UpdateWorkspaceDefaultsRequest:
      type: object
      required: [defaultWorkspaceParent]
      properties:
        defaultWorkspaceParent: { type: [string, 'null'], description: "Absolute path of an existing direct non-symbolic-link directory, or null to clear the preference." }
      additionalProperties: false
    DeviceSessionList:
      type: object
      required: [sessions]
      properties:
        sessions: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
      additionalProperties: false
    DeviceSession:
      type: object
      required: [handle, deviceLabel, issuedAt, current]
      properties: { handle: { type: string }, deviceLabel: { type: string }, issuedAt: { type: integer }, current: { type: boolean } }
      additionalProperties: false
    ReadinessResult:
      type: object
      required: [layer, status, message]
      properties:
        layer: { enum: [binary, version, runtime, credential, capability] }
        status: { enum: [ready, unavailable, not-applicable] }
        message: { type: string, minLength: 1 }
      additionalProperties: false
    AuthenticationCredentialAssignment:
      type: object
      required: [workspaceId, credentialId, role, host]
      properties:
        workspaceId: { $ref: '#/components/schemas/WorkspaceId' }
        credentialId: { $ref: '#/components/schemas/CredentialId' }
