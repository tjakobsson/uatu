      oneOf:
        - { $ref: '#/components/schemas/AuthenticationCredentialAssignment' }
        - { $ref: '#/components/schemas/SigningCredentialAssignment' }
      description: Advisory normal-tool selection for the local backend; same-UID processes are not isolated by this assignment.
    PublicSshCredential:
