        results: { type: array, items: { $ref: '#/components/schemas/ReadinessResult' } }
        guidance: { type: [string, 'null'] }
      additionalProperties: false
    CredentialList: { type: object, required: [credentials], properties: { credentials: { type: array, items: { $ref: '#/components/schemas/PublicCredential' } } }, additionalProperties: false }
    CredentialToolList: { type: object, required: [tools], properties: { tools: { type: array, items: { $ref: '#/components/schemas/PublicCredentialTool' } } }, additionalProperties: false }
    CredentialPublicKey:
      type: object
      required: [id, type, publicKey, fingerprint]
      properties: { id: { $ref: '#/components/schemas/CredentialId' }, type: { enum: [ssh, openpgp] }, publicKey: { type: string, minLength: 1 }, fingerprint: { type: string, minLength: 1 } }
      additionalProperties: false
    CredentialResponse: { type: object, required: [credential], properties: { credential: { $ref: '#/components/schemas/PublicCredential' } }, additionalProperties: false }
    CredentialToolResponse: { type: object, required: [tool], properties: { tool: { $ref: '#/components/schemas/PublicCredentialTool' } }, additionalProperties: false }
    CredentialAssignmentResponse: { type: object, required: [assignment], properties: { assignment: { $ref: '#/components/schemas/CredentialAssignment' } }, additionalProperties: false }
    CredentialAssignmentsResponse: { type: object, required: [assignments], properties: { assignments: { type: array, minItems: 1, maxItems: 2, items: { $ref: '#/components/schemas/CredentialAssignment' } } }, additionalProperties: false }
    CredentialUnassignedResponse: { type: object, required: [removed], properties: { removed: { type: boolean } }, additionalProperties: false }
    CredentialTestResponse: { type: object, required: [results], properties: { results: { type: array, items: { $ref: '#/components/schemas/ReadinessResult' } } }, additionalProperties: false }
    CredentialDeletedResponse: { type: object, required: [deleted], properties: { deleted: { type: boolean } }, additionalProperties: false }
