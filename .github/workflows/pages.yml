name: Pages

# Builds the UatuCode documentation site and deploys it to GitHub Pages on
# every push to main. The workflow validates the contract it publishes and
# checks the built site before deploying, so publication never depends on
# another workflow's outcome, on a cross-run artifact handoff, or on state
# left behind by an earlier publication.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Every deployment is the complete build output of one commit, so a
# superseded run loses nothing: the newer run publishes a strictly newer
# complete site. Cancelling is therefore safe here.
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate the contract being published
        run: bun run api:validate && bun run scripts/api-contract/structural.ts
      - name: Build the site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bunx astro build --root site
      - name: Check the built site
        run: bun run site:check
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
