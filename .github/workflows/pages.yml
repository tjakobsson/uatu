name: Publish API edge to Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

# Edge publications only need to serialize against themselves; the shared
# github-pages group lives on the deploy job so a queued release publication
# is never collapsed away by a later edge run.
concurrency:
  group: pages-edge
  cancel-in-progress: false

jobs:
  assemble:
    # head_branch alone is spoofable: a fork PR from a branch named `main`
    # also carries head_branch == 'main'. Require the triggering run to be a
    # push event from this repository before deploying anything it produced.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      history-sha: ${{ steps.history.outputs.sha }}
    steps:
      - name: Check out validated source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check out publication history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-history
          path: pages-history
          persist-credentials: false
      - name: Record history revision
        id: history
        run: echo "sha=$(git -C pages-history rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Download exact validated site artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: pages-edge-${{ github.event.workflow_run.head_sha }}
          path: validated-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Assemble edge without changing release history
        run: bun run scripts/api-contract/publish.ts --mode=edge --site=validated-site --history=pages-history --output=pages-output --commit=${{ github.event.workflow_run.head_sha }}
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: pages-output

  deploy:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Actual Pages deploys are serialized across this workflow and
    # api-release.yml; never cancelled, so no publication is lost.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Refuse to deploy a stale history snapshot
        env:
          ASSEMBLED_SHA: ${{ needs.assemble.outputs.history-sha }}
        # The assemble job read pages-history before this deploy slot opened;
        # a release publication may have advanced it in between. Deploying the
        # stale snapshot would roll the live api/latest and revisions back, so
        # verify the branch has not moved and fail loudly if it has — the
        # retry workflow re-runs a failed edge publication against the new
        # history automatically.
        run: |
          current=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/pages-history | cut -f1)
          if [ -z "$current" ] || [ -z "$ASSEMBLED_SHA" ]; then
            echo "could not resolve pages-history revisions for the staleness check"
            exit 1
          fi
          if [ "$current" != "$ASSEMBLED_SHA" ]; then
            echo "pages-history advanced during this run ($ASSEMBLED_SHA -> $current); re-run to assemble against the new release history"
            exit 1
          fi
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
