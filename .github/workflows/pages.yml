name: Pages

# Builds the UatuCode documentation site and deploys it to GitHub Pages on
# every push to main. The workflow validates the contract it publishes and
# checks the built site before deploying, so publication never depends on
# another workflow's outcome, on a cross-run artifact handoff, or on state
# left behind by an earlier publication.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# Never cancel an in-flight deployment. Each run is the complete build output
# of one commit, so cancelling loses no *state* — but it does lose a valid
# deployment whenever the run that replaced it then fails validation, leaving
# the site older than a commit that was ready to publish. Letting the active
# run finish costs at most one extra deployment in a burst: GitHub keeps one
# pending slot per group, so intermediate commits collapse and the newest
# still wins.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only ever publish main. A workflow_dispatch run checks out whichever ref
    # the dispatcher selected, so without this guard a maintainer could deploy
    # an unmerged branch straight to the public site — bypassing contract-fast
    # and contract-integration, which are enforced at the merge layer and so
    # have never run on that ref. Publication is safe by construction only
    # while "what we build" and "what the ruleset gated" are the same commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate the contract being published
        run: bun run api:validate && bun run scripts/api-contract/structural.ts
      - name: Build the site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bunx astro build --root site
      - name: Check the built site
        run: bun run site:check
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
