name: Publish released API contract

on:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions: {}

# Release publications get their own group: sharing github-pages at the
# workflow level lets GitHub silently drop a queued release run when a later
# edge pages run arrives (one pending run per group). Only the deploy job
# below shares the github-pages group with pages.yml.
concurrency:
  group: api-release
  cancel-in-progress: false

jobs:
  bundle:
    # Defense in depth against workflow_run spoofing: the triggering Release
    # run must be a push event from this repository, not a fork's lookalike.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release-tag: ${{ steps.release.outputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # This job never pushes; keep the contents:write token out of
          # .git/config while bun install and tests run.
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate tagged contract and integration behavior
        run: |
          bun run api:validate
          bun run scripts/api-contract/structural.ts
          bun run test:api
      - name: Build tagged Pages site
        env:
          GITHUB_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bunx astro build --root site
      - name: Create immutable release bundle
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          product_version=$(jq -r .version package.json)
          tag="v$product_version"
          release=$(gh release view "$tag" --json isDraft,publishedAt)
          if [ "$(jq -r .isDraft <<<"$release")" != false ]; then
            echo "::error::Release $tag is not published" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          if [ "$(git rev-parse "$tag^{commit}")" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::error::Release tag $tag does not identify the triggering Release workflow commit" >&2
            exit 1
          fi
          published_at=$(jq -r .publishedAt <<<"$release")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          bun run scripts/api-contract/release-bundle.ts api api-release-bundle "${{ github.event.workflow_run.head_sha }}" "$published_at" "$product_version"
      - name: Attach contract bundle to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          tar -czf "uatu-api-contract-$tag.tar.gz" -C api-release-bundle .
          gh release upload "$tag" "uatu-api-contract-$tag.tar.gz" --clobber
      - name: Upload validated release inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-release-${{ github.event.workflow_run.head_sha }}
          path: |
            api-release-bundle
            site/dist
          if-no-files-found: error
          # A rerun after a partial failure must be able to replace the
          # artifact instead of failing at upload.
          overwrite: true

  assemble:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # Never pushed from; keep the token out of .git/config.
          persist-credentials: false
      - name: Check out publication history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-history
          path: pages-history
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Download validated release inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-release-${{ github.event.workflow_run.head_sha }}
          path: validated-release
      - name: Prefer the newest validated main site
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        # A release deploys the FULL site. If main advanced past the tag and
        # its edge already deployed, shipping the tag-built site would roll
        # /api/edge and the documentation pages back with nothing scheduled
        # to restore them. Prefer the newest successful main CI run's
        # validated site artifact (verifying it names that run's commit).
        # When a strictly newer main site exists but its artifact cannot be
        # fetched intact (pages-edge artifacts are retained briefly), FAIL
        # instead of falling back: a fallback would deploy the older
        # tag-built site over the live newer one with no failed edge run to
        # restore it. Re-run the latest main CI (regenerating its artifact)
        # and then re-run this publication.
        run: |
          site_dir=validated-release/site/dist
          run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0] // empty | "\(.id) \(.head_sha)"')
          if [ -n "$run" ]; then
            run_id=${run%% *}
            head_sha=${run##* }
            if [ "$head_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
              # The latest successful main CI run can predate the tag (the
              # tag's own CI still running or failed): only a strict
              # descendant of the tagged commit may replace the tag-built
              # site, or the release would roll the site backward.
              ancestry=$(gh api "repos/${{ github.repository }}/compare/${{ github.event.workflow_run.head_sha }}...$head_sha" --jq .status || echo unknown)
              if [ "$ancestry" != "ahead" ]; then
                echo "latest main CI commit $head_sha is '$ancestry' relative to the tag; keeping the tag-built site"
              else
                if ! gh run download "$run_id" --name "pages-edge-$head_sha" --dir newer-edge --repo "${{ github.repository }}"; then
                  echo "::error::a newer validated main site ($head_sha) is live but its pages-edge artifact is unavailable; re-run the latest main CI to regenerate it, then re-run this publication" >&2
                  exit 1
                fi
                edge_commit=$(jq -r '.sourceCommit // empty' newer-edge/api/edge/contract.json)
                if [ "$edge_commit" != "$head_sha" ]; then
                  echo "::error::newer edge artifact names ${edge_commit:-<missing>}, not $head_sha; refusing to deploy either an unverified or an older site" >&2
                  exit 1
                fi
                site_dir=newer-edge
              fi
            fi
          fi
          echo "dir=$site_dir" >> "$GITHUB_OUTPUT"
      - name: Assemble immutable revision and latest
        run: bun run scripts/api-contract/publish.ts --mode=release --site=${{ steps.site.outputs.dir }} --history=pages-history --output=pages-output --bundle=validated-release/api-release-bundle --commit=${{ github.event.workflow_run.head_sha }}
      - name: Upload assembled publication
        # The deploy job persists this to pages-history while it holds the
        # github-pages lock; assembling and persisting in one unserialized job
        # would let an edge deploy race the history write.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-publication-${{ github.event.workflow_run.head_sha }}
          path: pages-output
          if-no-files-found: error
          overwrite: true
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: pages-output

  deploy:
    needs: [bundle, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Actual Pages deploys are serialized across this workflow and pages.yml;
    # never cancelled, so no publication is lost. The pages-history push
    # happens INSIDE this lock (and before deploy-pages): every history write
    # holds the same lock the edge staleness guard runs under, so an edge run
    # can never deploy a snapshot the guard validated against a branch that
    # then moved. Push-before-deploy means a failed deployment leaves history
    # ahead of Pages, which the next edge deploy republishes — self-healing —
    # while deploy-before-push would open a rollback window instead.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Check out publication history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: pages-history
          path: pages-history
          # Credentials stay persisted here on purpose: the persist step
          # below pushes this checkout back to pages-history.
      - name: Download assembled publication
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: api-publication-${{ github.event.workflow_run.head_sha }}
          path: pages-output
      - name: Persist release publication history
        run: |
          rsync -a --delete --exclude=.git pages-output/ pages-history/
          git -C pages-history add --all
          if ! git -C pages-history diff --cached --quiet; then
            git -C pages-history -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "docs(api): publish ${{ needs.bundle.outputs.release-tag }} contract"
            git -C pages-history push origin HEAD:pages-history
          fi
      - name: Deploy released Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
