name: Edge

# Nightly bleeding-edge channel for uatu and UatuCode Desktop: builds main
# with the same compile/smoke pipeline (CLI) and embed/sign/notarize
# pipeline (desktop) as releases, and publishes everything to the rolling
# `edge` prerelease that Formula/uatu-edge.rb and Casks/uatu-desktop@edge.rb
# follow. (The formula token is uatu-edge, not uatu@edge: brew's
# filename→class mapping only rewrites `@` before a digit, so an @edge
# formula could never load; cask tokens have no such rule.)
# Skips when main hasn't moved since the last edge build, and never
# publishes unsigned desktop builds — with signing secrets unavailable the
# run FAILS (red nightly) so a bad secret rotation can't silently stop the
# channel.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: edge
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Skip when the current main is already fully published
        id: guard
        # "Published" means the edge tag points at HEAD AND all assets —
        # desktop and CLI archives, their provenance bundles, SHA256SUMS,
        # VERSION — are on the release, not just the tag. gh release create
        # makes the tag itself on the first publication, so a tag-only check
        # would let a failed inaugural (or partial) upload block every retry
        # until main moves again.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(git rev-parse HEAD)"
          published="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/edge" --jq .object.sha 2>/dev/null || echo none)"
          assets="$(gh release view edge --json assets --jq '.assets[].name' 2>/dev/null || true)"
          complete=true
          for asset in UatuCode-Desktop-arm64.zip UatuCode-Desktop-arm64.zip.sigstore.json \
                       UatuCode-Desktop-x64.zip UatuCode-Desktop-x64.zip.sigstore.json \
                       uatu-darwin-arm64.zip uatu-darwin-arm64.zip.sigstore.json \
                       uatu-darwin-x64.zip uatu-darwin-x64.zip.sigstore.json \
                       uatu-linux-x64.tar.gz uatu-linux-x64.tar.gz.sigstore.json \
                       uatu-linux-arm64.tar.gz uatu-linux-arm64.tar.gz.sigstore.json \
                       SHA256SUMS VERSION; do
            echo "$assets" | grep -qx "$asset" || complete=false
          done
          if [ "$current" = "$published" ] && [ "$complete" = true ]; then
            echo "edge already fully published for $current; nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require signing secrets
        id: gate
        if: steps.guard.outputs.changed == 'true'
        # Unlike releases there is no unsigned-artifact fallback: edge
        # exists to be installed, and an unsigned quarantined app is a
        # support trap. Missing secrets FAIL the run (red nightly) rather
        # than skipping green, so a bad secret rotation surfaces instead
        # of silently stopping the channel.
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          if [ -z "$CERT" ] || [ -z "$CERT_PASSWORD" ] || [ -z "$NOTARY_KEY" ] || [ -z "$NOTARY_KEY_ID" ] || [ -z "$NOTARY_ISSUER" ]; then
            echo "::error::Developer ID signing secrets unavailable — edge builds are only distributed signed" >&2
            exit 1
          fi

      - name: Set up Bun
        if: steps.guard.outputs.changed == 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        if: steps.guard.outputs.changed == 'true'
        run: bun install --frozen-lockfile

      - name: Compute edge version
        id: version
        if: steps.guard.outputs.changed == 'true'
        # <base>-edge.<utc-timestamp>.<sha> sorts between the previous
        # release and the next one, and the full timestamp keeps same-day
        # builds ordered too (short SHAs don't sort by commit order), so
        # brew upgrade always moves forward — including edge → next stable.
        # Computed before compilation so the binaries are stamped with it.
        run: |
          base="$(bun -e 'console.log(require("./package.json").version)')"
          version="$base-edge.$(date -u +%Y%m%d%H%M%S).$(git rev-parse --short HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "edge version: $version"

      - name: Cross-compile all CLI targets
        if: steps.guard.outputs.changed == 'true'
        # Same four targets as stable releases. --version stamps the edge
        # version so `uatu --version` identifies an edge build and the
        # uatu-edge formula's self-test passes.
        run: |
          for target in darwin-arm64 darwin-x64 linux-x64 linux-arm64; do
            bun run scripts/build.ts --target="bun-$target" --outfile="dist/$target/uatu" \
              --version "${{ steps.version.outputs.version }}"
          done

      - name: Install Playwright Chromium
        if: steps.guard.outputs.changed == 'true'
        run: bunx playwright install --with-deps chromium

      - name: Smoke-test the darwin-arm64 binary
        if: steps.guard.outputs.changed == 'true'
        # The runner is arm64 macOS, so this artifact — an exact binary
        # being published — can be executed here. A failure stops the
        # nightly before anything (CLI or desktop) is published.
        run: bun run smoke
        env:
          UATU_SMOKE_BINARY: dist/darwin-arm64/uatu

      - name: Package CLI release assets
        if: steps.guard.outputs.changed == 'true'
        # Same contract as stable releases: zip for darwin, tar.gz for
        # linux, each archive holding a single `uatu` binary at its root.
        run: |
          mkdir -p dist/release
          for target in darwin-arm64 darwin-x64; do
            zip -j "dist/release/uatu-$target.zip" "dist/$target/uatu"
          done
          for target in linux-x64 linux-arm64; do
            tar -czf "dist/release/uatu-$target.tar.gz" -C "dist/$target" uatu
          done

      - name: Build UatuCode Desktop for both architectures
        if: steps.guard.outputs.changed == 'true'
        run: |
          for arch in arm64 x64; do
            xcode_arch="$arch"; [ "$arch" = "x64" ] && xcode_arch="x86_64"
            xcodebuild \
              -project desktop/macos/UatuCodeDesktop.xcodeproj \
              -scheme UatuCodeDesktop \
              -configuration Release \
              -derivedDataPath "desktop/macos/build-$arch" \
              ARCHS="$xcode_arch" ONLY_ACTIVE_ARCH=NO \
              MARKETING_VERSION="${{ steps.version.outputs.version }}" \
              build
          done

      - name: Sign, notarize, and staple
        if: steps.guard.outputs.changed == 'true'
        uses: ./.github/actions/sign-notarize-app
        with:
          cert-p12: ${{ secrets.MACOS_CERT_P12 }}
          cert-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          notary-key: ${{ secrets.NOTARY_KEY }}
          notary-key-id: ${{ secrets.NOTARY_KEY_ID }}
          notary-issuer: ${{ secrets.NOTARY_ISSUER }}
          arm64-app: desktop/macos/build-arm64/Build/Products/Release/UatuCode Desktop.app
          x64-app: desktop/macos/build-x64/Build/Products/Release/UatuCode Desktop.app
          output-dir: dist/release

      - name: Attest build provenance
        if: steps.guard.outputs.changed == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/UatuCode-Desktop-*
            dist/release/uatu-*

      - name: Download provenance bundles for the archives
        if: steps.guard.outputs.changed == 'true'
        # Mirrors the release workflow: the attest step pushes provenance to
        # the GitHub attestation store, but Scorecard's Signed-Releases
        # check — and anyone verifying without `gh` — reads the release
        # assets themselves. Fetch each archive's Sigstore bundle back out
        # of the store so it ships next to the archive. Download is
        # digest-addressed, so on a rerun the bundle always matches the
        # freshly rebuilt archive.
        run: |
          for f in dist/release/UatuCode-Desktop-*.zip dist/release/uatu-darwin-*.zip dist/release/uatu-linux-*.tar.gz; do
            name="$(basename "$f")"
            dir="$(mktemp -d)"
            (cd "$dir" && gh attestation download "$GITHUB_WORKSPACE/$f" --repo "$GITHUB_REPOSITORY" --limit 1)
            mv "$dir"/*.jsonl "dist/release/$name.sigstore.json"
          done
          ls -l dist/release/*.sigstore.json
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish rolling edge prerelease
        id: publish
        if: steps.guard.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd dist/release && shasum -a 256 UatuCode-Desktop-*.zip uatu-darwin-*.zip uatu-linux-*.tar.gz > SHA256SUMS && cat SHA256SUMS)
          printf '%s\n' "$VERSION" > dist/release/VERSION
          commit="$(git rev-parse HEAD)"
          notes="Bleeding-edge build of uatu and UatuCode Desktop from \`main\`.

          - commit: $commit
          - version: $VERSION
          - built: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          CLI: \`brew install tjakobsson/tap/uatu-edge\`
          Desktop: \`brew install --cask tjakobsson/tap/uatu-desktop@edge\`
          Stable channels: \`brew install tjakobsson/tap/uatu\` / \`brew install --cask tjakobsson/tap/uatu-desktop\`"
          # Assets first, tag last: the skip guard keys on the tag, so a
          # failed upload must leave the old tag in place — otherwise the
          # next nightly would see "unchanged" and never retry, leaving
          # stale assets behind a moved tag.
          if ! gh release view edge > /dev/null 2>&1; then
            gh release create edge --prerelease --target "$commit" \
              --title "uatu edge" --notes "$notes"
          fi
          gh release upload edge --clobber \
            dist/release/UatuCode-Desktop-*.zip dist/release/UatuCode-Desktop-*.zip.sigstore.json \
            dist/release/uatu-darwin-*.zip dist/release/uatu-linux-*.tar.gz \
            dist/release/uatu-darwin-*.zip.sigstore.json dist/release/uatu-linux-*.tar.gz.sigstore.json \
            dist/release/SHA256SUMS dist/release/VERSION
          gh release edit edge --prerelease --title "uatu edge" --notes "$notes"
          git tag -f edge "$commit"
          git push -f origin edge

  update-tap:
    # Runs on every successful nightly — including skipped-build runs —
    # and reconciles the formula and cask with whatever the edge release
    # currently holds, so a transiently failed tap push self-heals the
    # next night without rebuilding.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Download release metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view edge > /dev/null 2>&1; then
            echo "no edge release yet; nothing to reconcile"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download edge --pattern SHA256SUMS --output SHA256SUMS
          gh release download edge --pattern VERSION --output VERSION
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Update the uatu-edge formula and uatu-desktop@edge cask
        if: steps.meta.outputs.exists == 'true'
        # The formula is unconditional — a complete edge release always
        # carries CLI archives, so a missing SHA256SUMS entry is a real
        # error, unlike the cask's tolerated exit-2 unsigned-release skip
        # in the stable workflow. The formula token is uatu-edge (see the
        # header comment); the cask keeps its @edge token.
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/tjakobsson/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          bun run scripts/generate-formula.ts \
            --version "$VERSION" --sums SHA256SUMS \
            --name uatu-edge --tag edge \
            --out "tap/Formula/uatu-edge.rb"
          bun run scripts/generate-cask.ts \
            --version "$VERSION" --sums SHA256SUMS \
            --name uatu-desktop@edge --tag edge \
            --out "tap/Casks/uatu-desktop@edge.rb"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Formula/uatu-edge.rb" "Casks/uatu-desktop@edge.rb"
          if git diff --cached --quiet; then
            echo "Tap already up to date for edge $VERSION"
          else
            git commit -m "uatu-edge + uatu-desktop@edge $VERSION"
            git push origin HEAD
          fi
