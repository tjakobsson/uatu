name: Scorecard

# OpenSSF Scorecard supply-chain security analysis. Runs weekly and on
# pushes to main (branch-protection and settings changes only re-score on
# push/schedule, not on PRs). Results are published to the OpenSSF API
# (which feeds the README badge) and uploaded to GitHub code scanning.

on:
  schedule:
    # Tuesdays 06:00 UTC — offset from the Monday dependency audit.
    - cron: "0 6 * * 2"
  push:
    branches: [main]
  workflow_dispatch:

# The scorecard action documents read-all as its required baseline; the
# write scopes it needs are granted per-job below.
permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      # Required to upload SARIF results to code scanning.
      security-events: write
      # Required by publish_results to sign the results with OIDC.
      id-token: write
      # Not strictly needed while the repo is public (public contents are
      # readable regardless of token scopes), but explicit so the job-level
      # block overriding the workflow-level read-all keeps checkout working
      # even if the repo ever goes private.
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
