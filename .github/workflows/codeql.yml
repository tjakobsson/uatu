name: CodeQL

# Static analysis over the TypeScript codebase. Findings surface in the
# Security tab (code scanning); this is not a required PR check. Every
# push and pull request is analyzed — no path filters, so no commit goes
# unanalyzed (OpenSSF Scorecard's SAST check counts coverage per commit).
# The Swift desktop wrapper is deliberately excluded — analyzing it needs
# a macOS runner and can be added as a follow-up.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Wednesdays 06:00 UTC — a weekly backstop analysis of main.
    - cron: "0 6 * * 3"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      # Required to upload analysis results to code scanning.
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:javascript-typescript"
