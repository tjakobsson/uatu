name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate contract structure
        run: bun run api:validate && bun run scripts/api-contract/structural.ts
      - name: Enforce compatibility against the base contract
        # Pull requests compare against the PR base; pushes to main compare
        # the merged state against the pre-push tip (github.event.before) so
        # the gate also covers what actually landed.
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [[ "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "No usable base commit for compatibility comparison; skipping."
            exit 0
          fi
          if ! git cat-file -e "$BASE_SHA:api/openapi.yaml" || ! git cat-file -e "$BASE_SHA:api/streaming.yaml" || ! git cat-file -e "$BASE_SHA:api/contract.json"; then
            echo "Base commit has no published API contract; treating this as contract initialization."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/base-api"
          for file in openapi.yaml streaming.yaml contract.json; do
            git show "$BASE_SHA:api/$file" > "$RUNNER_TEMP/base-api/$file"
          done
          base_args=()
          if git cat-file -e "$BASE_SHA:api/operations.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/operations.yaml" > "$RUNNER_TEMP/base-api/operations.yaml"
            base_args+=(--base-operations="$RUNNER_TEMP/base-api/operations.yaml")
          fi
          if git cat-file -e "$BASE_SHA:api/exclusions.yaml" 2>/dev/null; then
            git show "$BASE_SHA:api/exclusions.yaml" > "$RUNNER_TEMP/base-api/exclusions.yaml"
            base_args+=(--base-exclusions="$RUNNER_TEMP/base-api/exclusions.yaml")
          fi
          bun run scripts/api-contract/compatibility.ts \
            --base-contract="$RUNNER_TEMP/base-api/openapi.yaml" \
            --base-streaming="$RUNNER_TEMP/base-api/streaming.yaml" \
            --base-metadata="$RUNNER_TEMP/base-api/contract.json" \
            "${base_args[@]}" \
            --contract=api/openapi.yaml \
            --streaming=api/streaming.yaml \
            --metadata=api/contract.json \
            --changelog=api/CHANGELOG.md

  contract-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: contract-fast
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run black-box HTTP and streaming contract checks
        run: bun run test:api
      - name: Verify Swift client generation
        run: bun run api:swift
      - name: Build validated Pages site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: bunx astro build --root site
      - name: Check API site content and links
        run: bun run site:check

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=true

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -n "$BASE_SHA" ] && [[ ! "$BASE_SHA" =~ ^0+$ ]]; then
            changed=$(git diff --no-renames --name-only "$BASE_SHA" "$GITHUB_SHA") || exit 1
            code=false
            while IFS= read -r file; do
              case "$file" in
                docs/*|openspec/*|.claude/*|.opencode/*|desktop/macos/*|ARCHITECTURE.md|CHANGELOG.md|CLAUDE.md|CONTRIBUTING.md|README.md|SECURITY.md|LICENSE|LICENSES/*|.github/*)
                  ;;
                *)
                  # Unknown paths are code until explicitly classified above.
                  code=true
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"

  unit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        # Bun executes and bundles TypeScript without ever checking it, so
        # tsc --noEmit (strict tsconfig) is the only thing standing between
        # a type error and main. Cheapest check, so it runs first.
        run: bun run typecheck

      - name: Audit dependencies for vulnerabilities
        # Fails the build on a moderate-or-higher advisory against the
        # installed tree, so new advisories surface on the PR rather than by
        # manual `bun audit`. Low-severity advisories are reported but do not
        # block. Renovate (lockFileMaintenance + osvVulnerabilityAlerts) is the
        # primary remediation path; this is the backstop.
        run: bun audit --audit-level=moderate

      - name: Run unit and integration tests
        # Four worker processes, one per runner core, each running whole test
        # files in isolation; the committed timings start the slowest files
        # first. Refresh them with `bun run test:ci --update-timings`.
        run: bun run test:ci

      - name: Run license audit
        run: bun run check:licenses

      - name: Build standalone executable
        run: bun run build

      # The smoke test drives the compiled binary with Chromium; the unit
      # suite needs no browser. Browsers are cached per Playwright version;
      # the system libraries they link against are installed every run.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright-core/package.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Playwright Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: Install Playwright Chromium system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium

      - name: Save Playwright Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Smoke-test the compiled binary
        # Catches compile-mode-only bugs the e2e suite misses: it runs in
        # dev mode against tests/e2e/server.ts, not against ./dist/uatu.
        # The feature-folder refactor (PR #57) shipped two such bugs that
        # this smoke would have caught — HTMLBundle chunks falling through
        # to the SPA fallback, and app.ts becoming a lazy __esm() module
        # whose init never ran at boot.
        run: bun run smoke

  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every leg runs to the end so the merged report shows all failures.
      fail-fast: false
      matrix:
        include:
          # The functional project runs in two legs split by file list
          # (UATU_E2E_LEG, see playwright.config.ts), balanced by measured
          # worker time; each leg runs the config's 4 workers.
          - name: leg 1 of 2
            id: leg-1
            leg: "1"
            args: --project=e2e
          - name: leg 2 of 2
            id: leg-2
            leg: "2"
            args: --project=e2e
          # The timing-budget suites (tagged @perf) run apart, with the perf
          # project's own lower worker limit, so neighbouring workers cannot
          # eat into their frame and interaction budgets.
          - name: perf
            id: perf
            args: --project=perf

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(jq -r .version node_modules/playwright-core/package.json)" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium and WebKit
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit

      - name: Install Playwright Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium webkit

      - name: Save Playwright Chromium and WebKit
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

      - name: Run Playwright end-to-end tests
        env:
          # CI reports as a blob per leg; e2e-report merges them into the
          # HTML report when a leg fails.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.id }}.zip
          UATU_E2E_LEG: ${{ matrix.leg }}
        run: bun run test:e2e ${{ matrix.args }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: blob-report-${{ matrix.id }}
          path: blob-report
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Playwright test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-test-results-${{ matrix.id }}
          path: test-results
          if-no-files-found: ignore

  e2e-report:
    needs: [changes, e2e]
    # Only a failed run needs the HTML report, as before the split.
    if: ${{ always() && needs.changes.outputs.code == 'true' && needs.e2e.result != 'success' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into an HTML report
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bunx playwright merge-reports --reporter html ./all-blob-reports

      - name: Upload Playwright report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report

  # The single required check. Unit, build and e2e run as separate jobs;
  # this one keeps the `validate` name the merge ruleset requires and passes
  # only when every one of them passed, or all were skipped for a change
  # that touches no code.
  validate:
    needs: [changes, unit, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every validation job
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          UNIT: ${{ needs.unit.result }}
          E2E: ${{ needs.e2e.result }}
        run: |
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Change classification finished '$CHANGES'."
            exit 1
          fi
          if [ "$CODE" = "true" ]; then expected=success; else expected=skipped; fi
          failed=0
          for job in "unit:$UNIT" "e2e:$E2E"; do
            if [ "${job#*:}" != "$expected" ]; then
              echo "::error::Job ${job%%:*} finished '${job#*:}', expected '$expected'."
              failed=1
            fi
          done
          exit "$failed"

  validate-specs:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate OpenSpec specs and changes
        run: bunx @fission-ai/openspec validate --all --strict
